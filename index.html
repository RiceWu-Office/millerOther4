<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#fff7ec">
<title>期中考複習小教室</title>
<meta name="description" content="四年級上學期第一次定期評量互動複習：康軒國語第1-6課、康軒社會第1-2單元、南一自然第1-2單元。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7ec;--card:#fff;--ink:#2b2730;--muted:#6f6875;--line:#efe3d2;
  --ok:#23955a;--okbg:#e7f6ed;--okline:#b6e2c6;
  --no:#d64541;--nobg:#fdeceb;--noline:#f2c0bd;
  --hint:#b86e00;--hintbg:#fff3dc;--hintline:#f3d39a;
  --sc:#5873d6;--sc2:#e8edfb;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.65 "Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif}
button{font:inherit;color:inherit}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 56px}
b{font-weight:700}
.sm{font-size:.92rem}
/* 首頁 */
.hero{text-align:center;padding:10px 0 4px}
.badge{display:inline-block;background:#fff;border:2px solid var(--line);border-radius:999px;padding:3px 14px;font-size:.85rem;color:var(--muted)}
h1{font-size:clamp(1.7rem,6vw,2.3rem);margin:.25em 0 0;font-weight:900;letter-spacing:.03em}
.sub{color:var(--muted);margin:0 0 6px}
.teacher{display:flex;gap:12px;align-items:flex-start;margin:14px 0}
.av{flex:none;width:52px;height:52px;border-radius:50%;background:#ffe2b8;display:grid;place-items:center;font-size:28px;border:3px solid #fff;box-shadow:0 2px 0 var(--line)}
.bubble{position:relative;background:#fff;border:2px solid var(--line);border-radius:16px;padding:12px 16px;flex:1;min-width:0}
.bubble:before{content:"";position:absolute;left:-9px;top:17px;width:14px;height:14px;background:#fff;border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.teacher.mini{margin:0 0 12px}
.teacher.mini .av{width:42px;height:42px;font-size:22px}
.teacher.mini .bubble{padding:8px 14px;font-size:.95rem}
.teacher.mini .bubble:before{top:12px}
.subjects{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 12px}
.subj{display:flex;flex-direction:column;gap:2px;text-align:left;border:2px solid var(--sc);border-radius:18px;padding:16px 14px;background:#fff;box-shadow:0 5px 0 var(--sc);cursor:pointer;transition:transform .08s,box-shadow .08s}
.subj:hover{background:var(--sc2)}
.subj:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sc)}
.subj .ic{font-size:30px;line-height:1.2}
.subj b{font-size:1.35rem;color:var(--sc)}
.subj small{color:var(--muted);line-height:1.45;font-size:.85rem}
.subj small.r{color:var(--ink);font-weight:700;font-size:.9rem}
.mixbtn{width:100%;border:none;border-radius:18px;padding:16px;font-size:1.15rem;font-weight:700;background:#5873d6;color:#fff;box-shadow:0 5px 0 #3c55a8;cursor:pointer;transition:transform .08s,box-shadow .08s}
.mixbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #3c55a8}
.rules{margin-top:22px;background:#fff;border:2px dashed var(--line);border-radius:16px;padding:12px 16px}
.rules ul{margin:6px 0 0;padding-left:1.2em}
.rules li{margin:3px 0;font-size:.95rem}
.foot{color:var(--muted);font-size:.8rem;text-align:center;margin-top:22px}
/* 作答 */
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.ghost{flex:none;background:#fff;border:2px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;color:var(--muted);font-size:.88rem}
.prog{flex:1;min-width:0}
.pt{font-weight:700;font-size:.95rem;white-space:nowrap}
.pt small{font-weight:400;color:var(--muted)}
.bar{height:10px;background:#f0e5d4;border-radius:99px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--sc);border-radius:99px;transition:width .4s}
.meta{flex:none;text-align:right;font-size:.82rem;color:var(--muted);line-height:1.35}
.stars{color:#f0a500;letter-spacing:1px}
.card{background:var(--card);border-radius:20px;border:2px solid var(--line);padding:18px 18px 20px;box-shadow:0 6px 0 var(--line)}
.card+.card,.card+details,details+.actions,.card+.actions{margin-top:16px}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.pill{border-radius:999px;padding:2px 12px;font-size:.84rem;font-weight:700;background:#f4efe6;color:var(--muted);white-space:nowrap}
.pill.s{background:var(--sc);color:#fff}
.focus{font-size:.9rem;color:var(--muted);margin-bottom:12px}
.passage{background:#fffaf1;border-left:5px solid var(--sc);border-radius:10px;padding:12px 14px;margin:0 0 14px;line-height:1.9}
.passage .pt2{font-weight:700;margin-bottom:4px}
.fig{margin:0 0 14px;text-align:center}
.fig svg{width:100%;max-width:520px;height:auto;display:block;margin:0 auto}
.ptable{border-collapse:collapse;width:100%;font-size:.95rem;background:#fff}
.ptable th,.ptable td{border:1px solid #e6d9c4;padding:6px 8px;text-align:center}
.ptable th{background:#f7efe1}
.qt{font-size:1.18rem;font-weight:700;margin:4px 0 14px;line-height:1.8}
.opts{display:grid;gap:10px}
.opts.compact{grid-template-columns:repeat(auto-fit,minmax(64px,1fr))}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:54px;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;cursor:pointer;font-size:1.05rem;line-height:1.5;transition:background .1s,border-color .1s}
.opts.compact .opt{justify-content:center;font-size:1.3rem;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--sc)}
.lt{flex:none;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#f4efe6;font-weight:700;font-size:.95rem}
.opt.sel,.chip.sel{border-color:var(--sc);background:var(--sc2);box-shadow:0 0 0 2px var(--sc) inset}
.opt.sel .lt{background:var(--sc);color:#fff}
.opt.ok,.chip.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .lt{background:var(--ok);color:#fff}
.opt.no,.chip.no{border-color:var(--no);background:var(--nobg);color:#9a3431}
.opt.no .lt{background:var(--no);color:#fff}
.opt.x,.chip.x{background:#f4f2ef;border-color:#d9d3cb;border-style:dashed;color:#9a948d;box-shadow:none}
.opt.x .lt{background:#cfc9c1;color:#fff}
.opt.x .ot,.chip.x{text-decoration:line-through}
.opt.x .ot::before,.chip.x::before{content:"✗ ";text-decoration:none;display:inline-block;margin-right:2px}
.opt.dim,.chip.dim{opacity:.55}
.opt:disabled,.chip:disabled{cursor:default}
.blank{display:inline-block;min-width:4.2em;border-bottom:3px solid var(--sc);text-align:center;padding:0 8px;margin:0 4px;color:var(--sc);background:var(--sc2);border-radius:8px 8px 0 0}
.blank.ok{border-color:var(--ok);color:var(--ok);background:var(--okbg)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-width:76px;min-height:50px;padding:8px 16px;border-radius:12px;border:2px solid var(--line);background:#fff;font-size:1.12rem;font-weight:700;cursor:pointer;box-shadow:0 3px 0 var(--line)}
.chip:hover:not(:disabled){border-color:var(--sc)}
.fb{margin-top:16px;border-radius:14px;padding:12px 16px;border:2px solid}
.fb.ok{background:var(--okbg);border-color:var(--okline)}
.fb.hint{background:var(--hintbg);border-color:var(--hintline)}
.fb.no{background:var(--nobg);border-color:var(--noline)}
.fb .t{font-weight:700;font-size:1.06rem}
.fb .h{margin:6px 0;font-weight:500}
.fb .ans{margin:6px 0}
.fb ol{margin:4px 0 6px;padding-left:1.5em}
.fb li{margin:2px 0}
.fb .k{margin-top:8px;padding-top:8px;border-top:1px dashed rgba(0,0,0,.15)}
.actions{margin-top:16px;display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.btn{border:none;border-radius:14px;padding:12px 28px;font-size:1.1rem;font-weight:700;cursor:pointer;background:var(--sc);color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.2);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.alt{background:#fff;color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
/* 成績單 */
.sum{text-align:center}
.medal{font-size:56px;line-height:1}
.sum h2{margin:6px 0 0;font-size:1.3rem}
.big{font-size:3.4rem;font-weight:900;color:var(--sc);line-height:1.1;margin-top:6px}
.big small{font-size:1.4rem}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0 4px}
.stats div{background:#faf5ec;border-radius:12px;padding:8px 4px}
.stats b{display:block;font-size:1.5rem}
.stats span{font-size:.82rem;color:var(--muted)}
.sum .teacher{text-align:left}
h3{margin:0 0 10px;font-size:1.12rem}
.chiplist{display:flex;flex-wrap:wrap;gap:8px}
.mtag{background:var(--okbg);border:1px solid var(--okline);color:#1d6e44;border-radius:999px;padding:3px 12px;font-size:.9rem}
.weak{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.weak li{background:#fffaf1;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.weak .kk{margin-top:4px;font-size:.93rem}
.mini-pill{display:inline-block;border-radius:999px;padding:0 10px;font-size:.8rem;color:#fff;margin-right:4px;vertical-align:1px}
.tips{margin:0;padding-left:1.4em}
.tips li{margin:6px 0}
details.card summary{cursor:pointer;font-weight:700;font-size:1.05rem}
.rev{margin:10px 0 0;padding-left:1.6em}
.rev li{margin:8px 0;font-size:.93rem}
.rev .ra{color:var(--muted)}
.empty{color:var(--muted);font-size:.95rem}
@media (max-width:600px){
  body{font-size:16px}
  .subjects{grid-template-columns:1fr}
  .subj{flex-direction:row;flex-wrap:wrap;align-items:center;column-gap:10px}
  .subj small{width:100%}
  .btn{width:100%}
  .actions .btn{flex:1 1 100%}
  .card{padding:16px 14px 18px}
  .qt{font-size:1.1rem}
  .top{gap:8px}
}
</style>
</head>
<body>
<main class="wrap" id="app"></main>

<script>
'use strict';
/* ============ 單元焦點 ============ */
const F={
  g1:'第1課 水陸小高手',g2:'第2課 放學後',g3:'第3課 我的籃球夢',g4:'第4課 永遠的馬偕',g5:'第5課 假如給我三天光明',g6:'第6課 攀登生命的高峰',
  s1:'1-1 家鄉在哪裡（地圖）',s2:'1-2 家鄉的地形',s3:'1-3 氣候、水資源與生活',s4:'2-1 傳統住屋與生活',s5:'2-2 器物與生活',

};

/* ============ 閱讀文本（原創） ============ */
const P={
  poem:'<div class="pt2">〈跳繩〉</div>繩子甩呀甩，<br>在空中畫出一道彩虹；<br>我跳呀跳，<br>像一隻快樂的小青蛙。<br>數到一百下，<br>汗水偷偷溜下臉頰，<br>煩惱早就跳到九霄雲外。',
  comic:'星期五放學後，小安和哥哥都想看同一本新漫畫，兩人吵得面紅耳赤。媽媽沒有罵人，只問：「有沒有辦法讓兩個人都看得到？」哥哥想了想說：「我們一人看一章，看完就交給對方。」小安點點頭。那天晚上，兄弟倆一邊看，一邊討論劇情，笑聲傳遍了整個客廳。',
  yoyo:'小芬第一次玩扯鈴時，扯鈴總是從繩子上掉下來，她氣得想把扯鈴丟到一邊。教練笑著說：「每個高手，都是從掉了一百次開始的。」於是，小芬每天放學後都練習十分鐘。一個月後，她不但能讓扯鈴轉得又穩又快，還能把它拋到空中再穩穩接住。',
  mackay:'一百多年前，北臺灣的醫療很不發達，許多人生病只能吃草藥碰運氣。一位從加拿大來的年輕人在淡水住了下來，他一邊傳教，一邊替人治病，還常常背著藥箱走進山區。後來，家鄉的人捐錢支持他，讓他蓋起醫院、辦起學校。直到今天，以他命名的醫院仍然在照顧臺灣的人們。',
  leaf:'自然課上，老師請大家矇上眼睛，只用手去摸一片葉子。小傑摸到葉子邊緣有細細的鋸齒，背面還有一條條凸起的葉脈。他驚訝的說：「我每天都看到這種葉子，卻從來沒發現它摸起來這麼特別！」拿下眼罩後，小傑決定以後要更仔細的觀察身邊的事物。',
  jiang:'江秀真出生在新北市雙溪，從小在山邊長大。高中時，她第一次爬上高山，就被壯麗的雲海深深吸引。她說，高山像一位母親，有時溫柔的擁抱她，有時又嚴格的考驗她。為了挑戰世界最高峰，她進行了很長一段時間的體能訓練。西元1995年，她終於站上珠穆朗瑪峰的山頂，成為第一位登上世界最高峰的臺灣女性。',
  tools:'<div class="pt2">以前和現在的器物</div><table class="ptable"><tr><th>以前的器物</th><th>材料</th><th>現在的器物</th><th>材料</th></tr><tr><td>竹蒸籠</td><td>竹子</td><td>電鍋</td><td>金屬、塑膠</td></tr><tr><td>瓠瓢（舀水）</td><td>瓠瓜的外殼</td><td>水勺</td><td>塑膠</td></tr><tr><td>菜櫥</td><td>木頭</td><td>冰箱</td><td>金屬、塑膠</td></tr></table>',
  moonlog:'<div class="pt2">小芸的月亮觀測紀錄（同一天晚上）</div><table class="ptable"><tr><th>時間</th><th>方位</th><th>高度角</th></tr><tr><td>晚上 7 點</td><td>東方</td><td>約 20 度</td></tr><tr><td>晚上 8 點</td><td>東南方</td><td>約 35 度</td></tr><tr><td>晚上 9 點</td><td>南方偏東</td><td>約 45 度</td></tr></table>',
  breath:'<div class="pt2">水生動物怎麼呼吸？</div><table class="ptable"><tr><th>動物</th><th>呼吸方式</th></tr><tr><td>吳郭魚</td><td>用鰓吸取水中的氧氣</td></tr><tr><td>海豚</td><td>用肺呼吸，要浮出水面換氣</td></tr><tr><td>龍蝨</td><td>把空氣存在翅膀下面，帶著空氣潛水</td></tr></table>'
};

/* ============ 題庫 ============
 t: choice 選擇 / fill 填空 / situ 生活情境應用 / read 閱讀判讀
 lv: 1 基礎 / 2 進階 / 3 素養挑戰
 a: 正確選項（預設 0，顯示時會打亂順序；ns:1 表示不打亂）
 h: 第一次答錯的提示　st: 第二次答錯的步驟拆解　k: 觀念鞏固
*/
const QG=[
{f:F.g1,t:'choice',lv:1,tag:'字音',q:'「遨遊」的「遨」，正確的注音是哪一個？',o:['ㄠˊ','ㄠˋ','ㄧㄠˊ','ㄠ'],h:'「遨」的右邊是「敖」，和「熬夜」的「熬」讀音一樣喔！',st:['「遨」＝「辶」＋「敖」，「敖」是聲音的提示。','「熬夜」的「熬」讀ㄠˊ，所以「遨」也讀ㄠˊ（第二聲）。','遨遊就是自由自在的到處遊玩。'],k:'遨（ㄠˊ）遊＝自由自在的遊玩。'},
{f:F.g1,t:'choice',lv:1,tag:'部首',q:'「老鷹」的「鷹」，部首是哪一個？',o:['鳥','广','隹','亻'],h:'部首常常和字的意思有關。老鷹是哪一類動物呢？',st:['「鷹」由「广、亻、隹、鳥」組合而成。','老鷹是一種鳥，字的意思和「鳥」有關。','所以「鷹」的部首是「鳥」部。'],k:'鷹的部首是「鳥」；部首常和字的意思有關。'},
{f:F.g1,t:'fill',lv:1,tag:'生字運用',q:'夜市裡，媽媽買了一＿＿香甜的糖葫蘆給我。',o:['串','川','患','窗'],h:'把東西一個接一個穿在一起，要用哪個字當單位？',st:['糖葫蘆是一顆一顆串在竹籤上的。','把東西連在一起的單位詞是「串」，例如一串葡萄。','「患」的上面雖然也有「串」，但它是「心」部，意思是憂慮。'],k:'串：把東西連貫在一起，如一串葡萄、串珠子。'},
{f:F.g1,t:'fill',lv:2,tag:'句型節奏',q:'課文用「把兩個詞前後對調」的寫法，讓詩讀起來很有節奏。請照樣完成：「快樂奔跑，奔跑＿＿」',o:['快樂','跳躍','加速','飛翔'],h:'前半句是「快樂」和「奔跑」，後半句要把這兩個詞前後對調。',st:['前半句的兩個詞：「快樂」＋「奔跑」。','後半句把順序對調：「奔跑」＋「快樂」。','所以答案是「快樂」，整句是「快樂奔跑，奔跑快樂」。'],k:'兩個詞前後對調再說一次，句子會更有節奏感。'},
{f:F.g1,t:'choice',lv:2,tag:'修辭：譬喻',q:'下列哪一句用了「譬喻」修辭？',o:['我想像自己是一隻飛鷹','風呼呼的從耳邊吹過','煩惱被風帶走了','水珠一串串的飛起來'],h:'譬喻就是把甲比成乙，常會用到「像、好像、是、彷彿」。',st:['「風呼呼的吹」是在模仿聲音，是摹寫。','「煩惱被風帶走」讓風像人一樣會帶東西，是擬人。','「一串串」是疊詞；只有「我是一隻飛鷹」把「我」比成「飛鷹」，是譬喻。'],k:'譬喻＝把甲比成乙，例如「我像陀螺」「我是飛鷹」。'},
{f:F.g1,t:'situ',lv:3,tag:'修辭：擬人',q:'小雨要寫一篇〈運動真快樂〉的作文，老師提醒她用「擬人」寫出快樂的感覺。哪一句最合適？',o:['快樂的風牽著我的手，陪我一起往前跑','汗水像雨滴一樣不停落下','我繞著操場跑了一圈又一圈','我今天跑步跑得非常快'],h:'擬人是讓「不是人」的東西，做出人才會做的動作，或有人的情感。',st:['「汗水像雨滴」是把汗水比成雨滴，是譬喻。','「一圈又一圈」「跑得非常快」只是直接說明。','「風牽著我的手、陪我跑」讓風像朋友一樣，是擬人。'],k:'擬人＝讓物像人一樣有動作、有感情，如「風帶走煩惱」。'},
{f:F.g1,t:'read',lv:1,tag:'閱讀理解',p:P.poem,q:'在這首〈跳繩〉中，作者把「自己」比成什麼？',o:['小青蛙','彩虹','汗水','繩子'],h:'找找看詩裡「我……像……」的句子。',st:['詩中寫「我跳呀跳，像一隻快樂的小青蛙」。','「我」用「像」連接「小青蛙」。','所以作者把自己比成小青蛙，形容跳得又高又快樂。'],k:'找譬喻時，先找「像」字前後被比較的兩樣東西。'},
{f:F.g1,t:'read',lv:2,tag:'修辭：擬人',p:P.poem,q:'詩中「汗水偷偷溜下臉頰」，用了什麼修辭？',o:['擬人','譬喻','設問','排比'],h:'「偷偷」「溜」通常是誰才會做的動作？',st:['「偷偷的溜走」是人才會做的動作。','汗水不是人，卻被寫成會「偷偷溜」。','讓物像人一樣有動作，就是擬人。'],k:'擬人：把物當成人來寫，給它人的動作或情感。'},
{f:F.g1,t:'read',lv:3,tag:'閱讀推論',p:P.poem,q:'詩的最後寫「煩惱早就跳到九霄雲外」，表示作者的心情怎麼樣？',o:['跳繩跳得很開心，完全忘了煩惱','煩惱太多，跳不動了','煩惱跳得比自己還高','擔心繩子會飛走'],h:'「九霄雲外」是指非常非常遠的地方。煩惱跑到那麼遠，心情會怎樣？',st:['「九霄雲外」形容極遠的地方。','煩惱被丟到很遠的地方，代表已經不見了。','所以作者跳繩跳得很快樂，把煩惱都忘了，和課文「煩惱被風帶走」的意思相近。'],k:'運動能帶來快樂，讓人暫時拋開煩惱（〈水陸小高手〉的主旨）。'},
{f:F.g1,t:'situ',lv:1,tag:'語詞運用',q:'暑假裡，你參加了游泳營、直排輪課，還去露營。阿嬤笑著說你的暑假真是「＿＿」！哪一個語詞最適合？',o:['多采多姿','依依不捨','一掃而空','遙不可及'],h:'暑假活動又多又豐富，要選「內容豐富、變化很多」的語詞。',st:['「依依不捨」是捨不得離開；「一掃而空」是全部清光。','「遙不可及」是遠得到不了。','「多采多姿」形容內容豐富、變化多，最適合形容精彩的暑假。'],k:'多采多姿：形容內容豐富、變化很多。'},

{f:F.g2,t:'choice',lv:1,tag:'字音',q:'「依依不捨」的「捨」，正確的注音是哪一個？',o:['ㄕㄜˇ','ㄕㄜˋ','ㄕㄜ','ㄙㄜˇ'],h:'「捨不得」的「捨」是第三聲喔！',st:['「捨」是手部，表示放下、放棄，例如捨不得。','它讀ㄕㄜˇ（第三聲）。','小心！「宿舍」的「舍」讀ㄕㄜˋ（第四聲），不要搞混。'],k:'捨（ㄕㄜˇ）；依依不捨＝非常留戀、捨不得離開。'},
{f:F.g2,t:'choice',lv:1,tag:'部首',q:'「暫停」的「暫」，部首是哪一個？',o:['日','車','斤','一'],h:'「暫」是「短時間」的意思，想想哪個部件和時間有關？',st:['「暫」上面是「斬」（車＋斤），下面是「日」。','「暫」表示短時間，和時間（日）有關。','所以部首是「日」部。'],k:'暫的部首是「日」；暫停＝短時間停止。'},
{f:F.g2,t:'fill',lv:1,tag:'形近字',q:'放學後，我和姐姐、同學在公園玩「警察抓小＿＿」。',o:['偷','愉','輸','喻'],h:'會偷偷拿走別人東西的是「人」，要選人字旁（亻）的字。',st:['「小偷」指偷東西的人，所以用人字旁「亻」。','「愉」是心字旁（忄），用在「愉快」。','「輸」是車字旁，用在「輸贏」；「喻」是口字旁，用在「譬喻」。'],k:'偷（亻）：小偷；愉（忄）：愉快——看部首分辨意思。'},
{f:F.g2,t:'fill',lv:2,tag:'成語運用',q:'天快黑了，聽到媽媽喊吃晚餐，大家才＿＿的結束遊戲回家。',o:['依依不捨','一掃而空','熟能生巧','五彩繽紛'],h:'玩得正開心卻要回家，心情是「捨不得」的。',st:['大家玩得很開心，卻必須回家。','捨不得離開的心情，可以用「依依不捨」。','其他成語：一掃而空（全部清光）、熟能生巧（練熟了就有技巧）、五彩繽紛（顏色很多）。'],k:'依依不捨：非常留戀、捨不得分開。'},
{f:F.g2,t:'choice',lv:2,tag:'句型：一邊……一邊……',q:'「我一邊吃點心，一邊看《國語日報》。」這個句子表示什麼？',o:['兩件事同時進行','先做完一件事，再做另一件','只能選一件事做','兩件事都沒有做'],h:'「一邊……一邊……」的兩個動作，是在不同時間做，還是同一時間做？',st:['「一邊吃點心」和「一邊看報紙」是兩個動作。','這兩個動作是同一時間在做的。','所以「一邊……一邊……」表示兩件事同時進行。'],k:'「一邊……一邊……」：兩個動作同時進行。'},
{f:F.g2,t:'situ',lv:2,tag:'修辭理解',q:'弟弟看著桌上的蛋糕說：「蛋糕一直在對我招手耶！」弟弟真正想表達的是什麼？',o:['蛋糕看起來很好吃，他好想吃','蛋糕真的長出手了','蛋糕被風吹得動來動去','他想把蛋糕送給別人'],h:'蛋糕當然不會真的招手。這是〈放學後〉用過的「擬人」寫法，想想背後的意思。',st:['蛋糕不會真的招手，這是擬人修辭。','課文中點心像在「招招手」，是說點心很吸引人。','所以弟弟是說蛋糕看起來太好吃，讓他好想吃。'],k:'擬人背後的意思：點心「招手」＝點心很吸引人。'},
{f:F.g2,t:'situ',lv:1,tag:'語詞運用',q:'班上同樂會時，媽媽做的炸雞一端上桌，沒幾分鐘就被大家吃光了。哪個語詞最適合形容？',o:['一掃而空','依依不捨','此起彼落','遙不可及'],h:'東西很快就被全部吃完、拿光，可以用哪個語詞？',st:['炸雞很快就被吃得一點都不剩。','「一掃而空」形容很快的全部清除、吃光。','所以選「一掃而空」。'],k:'一掃而空：很快的全部吃完或拿光。'},
{f:F.g2,t:'read',lv:3,tag:'閱讀推論',p:P.comic,q:'兄弟兩人後來能開心的看完漫畫，最主要的原因是什麼？',o:['他們想出輪流看的方法','媽媽又買了一本漫畫','哥哥把漫畫全部讓給小安','媽媽規定不准看漫畫'],h:'找找看「哥哥想了想說」後面，他想出什麼辦法？',st:['一開始兩人都想看同一本漫畫，吵了起來。','哥哥想出「一人看一章，看完交給對方」的辦法，也就是輪流看。','有了公平的方法，兩人就能一起開心的看書，就像課文裡和姐姐輪流看報紙。'],k:'遇到爭吵時，想出「輪流」等公平的方法，就能化解衝突。'},

{f:F.g3,t:'choice',lv:2,tag:'多音字',q:'「反彈」的「彈」讀ㄊㄢˊ。下列哪一個詞語的「彈」也讀ㄊㄢˊ？',o:['彈琴','子彈','炸彈','飛彈'],h:'「子彈、炸彈、飛彈」都是武器，讀音一樣。哪一個是用手指撥動的動作？',st:['「彈」有兩個讀音：ㄊㄢˊ和ㄉㄢˋ。','當動作用（撥動、彈回來）時讀ㄊㄢˊ，例如反彈、彈琴。','當武器名稱時讀ㄉㄢˋ，例如子彈、炸彈、飛彈。'],k:'彈：ㄊㄢˊ（反彈、彈琴）／ㄉㄢˋ（子彈、炸彈）。'},
{f:F.g3,t:'choice',lv:1,tag:'部首',q:'「弧線」的「弧」，部首是哪一個？',o:['弓','瓜','子','爪'],h:'弧線是彎彎的線，它像拉開的什麼東西呢？',st:['「弧」＝「弓」＋「瓜」。','弧線彎彎的，形狀像一把弓。','所以「弧」的部首是「弓」部。'],k:'弧的部首是「弓」；弧線＝像弓一樣彎曲的線。'},
{f:F.g3,t:'fill',lv:1,tag:'成語運用',q:'只要每天練習投籃，就會＿＿，球越投越準。',o:['熟能生巧','此起彼落','依依不捨','翻山越嶺'],h:'每天練習、越來越厲害，是哪個成語說的道理？',st:['句子說「每天練習」，結果「越投越準」。','練習多了、熟練了，自然就會有技巧。','這就是「熟能生巧」。'],k:'熟能生巧：做得熟練了，自然能找到訣竅。'},
{f:F.g3,t:'fill',lv:2,tag:'形近字',q:'球場上的加油聲此起＿＿落，非常熱鬧。',o:['彼','被','皮','披'],h:'「此」是「這裡」，另一個字要表示「那裡」，它是雙人旁（彳）的字。',st:['「此起彼落」：這裡停了，那裡又響起。','表示「那、那裡」的字是「彼」，部首是「彳」。','「被」是衣字旁（衤），「披」是手字旁（扌），意思都不同。'],k:'此起彼落：接連不斷；彼（彳）＝那、那裡。'},
{f:F.g3,t:'choice',lv:2,tag:'修辭理解',q:'課文中，作者覺得籃球架像一座「遙不可及」的高山。作者想表達什麼？',o:['剛開始覺得投籃很難，好像怎麼樣都做不到','籃球架真的和山一樣高','籃球場蓋在高山上','作者很喜歡爬山'],h:'「遙不可及」是遠得碰不到。作者剛加入籃球社時，對投籃的感覺是什麼？',st:['這句用了譬喻，把籃球架比成高山。','「遙不可及」＝遠得到達不了。','意思是：剛開始學籃球時，覺得投籃非常困難。'],k:'譬喻的作用：用高山的「難爬」，表達投籃的「困難」。'},
{f:F.g3,t:'situ',lv:3,tag:'句型：只要……就……',q:'小明說：「我每天練鋼琴，還是會彈錯，乾脆放棄算了！」你想用「只要……就……」句型鼓勵他，哪一句最好？',o:['只要持續練習，就一定會越來越進步。','只要你放棄，就不用再練了。','只要彈錯，就要大聲罵自己。','只要練習一次，就能彈得很完美。'],h:'「只要……就……」前面放條件、後面放結果。哪一句的條件和結果合理，又能鼓勵人？',st:['「只要放棄就不用練」沒有鼓勵的意思。','「彈錯就罵自己」會讓人更沮喪；「練一次就完美」不合理。','「只要持續練習，就會越來越進步」條件合理、結果正向，最能鼓勵他。'],k:'只要……就……：前面是條件，後面是結果。'},
{f:F.g3,t:'read',lv:2,tag:'主旨',p:P.yoyo,q:'這段文字最想告訴我們什麼道理？',o:['只要不斷練習，就能熟能生巧','扯鈴是很危險的遊戲','要有天分才能學會扯鈴','教練說話很好笑'],h:'小芬一開始一直失敗，後來是怎麼變厲害的？',st:['一開始：扯鈴一直掉，小芬很生氣。','中間：她每天放學練習十分鐘。','結果：一個月後玩得又穩又快——說明不斷練習就能熟能生巧。'],k:'找主旨：看主角「怎麼改變」以及「為什麼改變」。'},

{f:F.g4,t:'choice',lv:1,tag:'字音',q:'「奉獻」的「獻」，正確的注音是哪一個？',o:['ㄒㄧㄢˋ','ㄒㄧㄢˇ','ㄒㄧㄢ','ㄒㄧㄢˊ'],h:'「獻」和「現在」的「現」讀音一樣喔！',st:['「獻」讀ㄒㄧㄢˋ，是第四聲。','它和「現在」的「現」同音。','奉獻＝把自己的力量或東西貢獻出來，例如馬偕為臺灣奉獻一生。'],k:'獻（ㄒㄧㄢˋ）；奉獻＝貢獻出自己的力量。'},
{f:F.g4,t:'choice',lv:1,tag:'部首',q:'「醫療」的「療」，部首是哪一個？',o:['疒','广','小','日'],h:'和生病、治病有關的字，常常用這個部首，例如「病、痛」。',st:['「療」的外框是「疒」。','「疒」和疾病有關，例如病、痛、療。','「療」是治病的意思，所以部首是「疒」。'],k:'療的部首是「疒」（和病痛有關）。'},
{f:F.g4,t:'fill',lv:1,tag:'成語／形近字',q:'馬偕常常翻山越＿＿，到偏遠的地方替人看病。',o:['嶺','領','鈴','零'],h:'「翻山越□」，這個字和「山」有關喔！',st:['翻山越嶺：越過一座又一座的山。','和山有關，要選山部的「嶺」。','「領」是頁部（領子），「鈴」是金部（鈴鐺）。'],k:'翻山越嶺：形容路途遙遠又辛苦；嶺是「山」部。'},
{f:F.g4,t:'fill',lv:2,tag:'句型：不但……還……',q:'馬偕不但替人看病，＿＿教大家清水溝、注意環境衛生。',o:['還','因為','雖然','如果'],h:'前面說「看病」，後面說他做了「更多」的事，要用表示「更進一步」的詞。',st:['「不但……還……」表示更進一步。','前面：替人看病；後面：還教大家注意衛生。','後面做的事比前面更多，所以用「還」。'],k:'不但……還……：表示更進一步。'},
{f:F.g4,t:'choice',lv:2,tag:'課文理解',q:'下列哪一件事「不是」馬偕在臺灣做的事？',o:['在臺北蓋了第一條鐵路','在淡水興建西式醫院','創辦新式學校和女學堂','教居民清水溝、改善衛生'],h:'想想馬偕的身分：傳教士、醫生、教育家。哪一個選項和這些身分都沒有關係？',st:['醫生：在淡水興建西式醫院、替人治病。','教育家：創辦新式學校和女學堂。','改善衛生也是他做的事；蓋鐵路和他無關。'],k:'馬偕：加拿大人，在臺灣傳教、行醫、辦學。'},
{f:F.g4,t:'read',lv:3,tag:'閱讀推論',p:P.mackay,q:'讀完這段文字，你認為課文題目〈永遠的馬偕〉中的「永遠」，最可能是什麼意思？',o:['他的愛心和貢獻，一直被人們記得','馬偕活了很久很久','馬偕的醫院永遠不會關門','馬偕永遠不回家鄉'],h:'看看最後一句：「直到今天……」，人們用什麼方式記得他？',st:['文章最後說，以他命名的醫院到今天還在照顧人們。','這表示他雖然已經過世很久，人們還是記得他。','所以「永遠」指他的愛心和故事永遠留在人們心中。'],k:'題目的「永遠」＝愛心與故事永遠流傳。'},

{f:F.g5,t:'choice',lv:1,tag:'字音',q:'「蓓蕾」的正確注音是哪一個？',o:['ㄅㄟˋ ㄌㄟˇ','ㄆㄟˊ ㄌㄟˊ','ㄅㄟˋ ㄌㄟˊ','ㄆㄟˋ ㄌㄟˇ'],h:'「蓓」和「加倍」的「倍」同音；「蕾」是第三聲。',st:['「蓓」讀ㄅㄟˋ，和「倍」同音。','「蕾」讀ㄌㄟˇ，第三聲。','蓓蕾就是還沒開的花苞。'],k:'蓓蕾（ㄅㄟˋ ㄌㄟˇ）＝還沒開放的花苞。'},
{f:F.g5,t:'choice',lv:2,tag:'改錯字',q:'下列哪一個詞語「沒有」錯字？',o:['舒適的地毯','舒滴的地毯','舒適的地談','舒敵的地毯'],h:'「舒適」的「適」是辶部；「地毯」是用毛做的，所以是「毛」部。',st:['「適」是辶部，不是「滴（水部）」或「敵（攴部）」。','「毯」是毛部，指用毛織成的墊子；「談」是言部，是說話。','所以正確的是「舒適的地毯」。'],k:'舒適（辶）、地毯（毛）——用部首判斷字義。'},
{f:F.g5,t:'fill',lv:1,tag:'成語運用',q:'春天的花園開滿了紅、黃、紫各種顏色的花，看起來＿＿，美極了。',o:['五彩繽紛','依依不捨','熟能生巧','翻山越嶺'],h:'句子說有「各種顏色」，要找形容顏色很多的成語。',st:['花園裡有紅、黃、紫各種顏色。','形容色彩豐富、鮮豔的成語是「五彩繽紛」。','其他成語都和顏色無關。'],k:'五彩繽紛：色彩豐富又鮮明。'},
{f:F.g5,t:'choice',lv:2,tag:'修辭：設問',q:'「每天走過的公園，怎麼會沒發現它的美呢？」這句話用了什麼修辭？',o:['設問','譬喻','擬人','排比'],h:'這句話用「問句」的方式寫，但作者心裡其實已經有答案了。',st:['這句話是一個問句。','作者不是真的不知道，而是要強調「公園很美，應該要發現」。','用問句來加強語氣、引起注意，就是設問。'],k:'設問：用問句加強語氣；課文用問句表達「不應該視而不見」。'},
{f:F.g5,t:'situ',lv:3,tag:'主旨應用',q:'讀完〈假如給我三天光明〉，下列哪一個做法最符合課文想告訴我們的道理？',o:['放學路上留意路邊的花草和天空，珍惜看得見的美好','每天一直看手機，眼睛累了也不休息','覺得身邊的東西都很普通，不用特別注意','把眼睛矇起來走路，看看會不會跌倒'],h:'海倫‧凱勒只能用手「摸」世界，卻發現了很多美好。她希望看得見的人怎麼做？',st:['海倫‧凱勒看不見，只能靠觸覺感受世界。','她不懂為什麼看得見的人，卻常常忽略身邊的美景。','所以課文要我們珍惜自己的感官，用心欣賞身邊的美好。'],k:'主旨：珍惜擁有的感官，用心觀察身邊的美好。'},
{f:F.g5,t:'read',lv:1,tag:'閱讀理解',p:P.leaf,q:'小傑為什麼會感到驚訝？',o:['他用手摸，發現了平常沒注意到的特點','他第一次看到葉子','老師送他一片葉子','葉子刺傷了他的手'],h:'找找看小傑說的話：「我每天都看到這種葉子，卻……」',st:['小傑每天都看得到這種葉子。','矇上眼睛用手摸，才發現鋸齒邊和凸起的葉脈。','他驚訝的是：原來有那麼多平常沒注意到的特點。'],k:'用心觀察，就能發現身邊事物的特別之處。'},

{f:F.g6,t:'choice',lv:1,tag:'部首',q:'「攀登」的「攀」，部首是哪一個？',o:['手','木','大','爻'],h:'攀登要用手抓著往上爬，看看這個字的最下面！',st:['「攀」的上面有兩個「木」和「爻」，下面是「手」。','攀爬需要用手抓住東西往上爬。','所以「攀」的部首是「手」部。'],k:'攀的部首是「手」；攀登＝抓著東西往上爬。'},
{f:F.g6,t:'choice',lv:2,tag:'多音字',q:'「磨練」的「磨」讀ㄇㄛˊ。下列哪一個詞語的「磨」讀ㄇㄛˋ？',o:['石磨','磨刀','折磨','磨墨'],h:'當「磨」是一種「器具的名稱」時，讀音會改變喔！',st:['「磨」當動作（摩擦、受苦）時讀ㄇㄛˊ，例如磨刀、折磨、磨墨、磨練。','當名稱，指把穀物磨碎的器具時讀ㄇㄛˋ。','「石磨」是一種器具，所以讀ㄇㄛˋ。'],k:'磨：ㄇㄛˊ（磨練、磨刀）／ㄇㄛˋ（石磨）。'},
{f:F.g6,t:'fill',lv:1,tag:'生字運用',q:'高山上空氣稀薄，登山家常需要背著＿＿氣瓶。',o:['氧','洋','羊','養'],h:'幫助我們呼吸的氣體，是「气」部的字。',st:['空氣中幫助我們呼吸的氣體叫「氧氣」。','「氧」是气部，和氣體有關。','「洋」是水部（海洋），「養」是食部（養育）。'],k:'氧（ㄧㄤˇ）是气部；氧氣幫助呼吸。'},
{f:F.g6,t:'fill',lv:2,tag:'句型：時而……時而……',q:'高山的天氣時而陽光燦爛，＿＿颳起大風雪，變化非常大。',o:['時而','因此','而且','只要'],h:'前面已經出現「時而」，後面要接什麼，才能表示兩種情況輪流出現？',st:['「時而……時而……」表示兩種情況交替出現。','前面：時而陽光燦爛；後面：時而颳起大風雪。','所以空格填「時而」。'],k:'時而……時而……：兩種情況輪流出現。'},
{f:F.g6,t:'situ',lv:3,tag:'人物精神',q:'江秀真登頂途中體力快用完時，想起過去成功的經驗鼓勵自己。如果你在跑步比賽中快跑不動了，哪一種想法最像她的精神？',o:['想起以前練習時撐過的辛苦，告訴自己再堅持一下','反正跑不完，現在就停下來','偷偷抄近路，比較快到終點','都是天氣太熱害我跑不動'],h:'她遇到困難時，是放棄、找藉口，還是想辦法鼓勵自己？',st:['江秀真遇到困難沒有放棄，也沒有找藉口。','她用過去的成功經驗鼓勵自己，堅持到底。','所以「想起以前撐過的辛苦，再堅持一下」最像她的精神。'],k:'江秀真的精神：有夢想就努力實踐，靠勇氣與決心克服困難。'},
{f:F.g6,t:'read',lv:3,tag:'閱讀推論',p:P.jiang,q:'文中說高山像母親，「有時又嚴格的考驗她」。這裡的「嚴格」最可能指什麼？',o:['高山的天氣和地形很危險、很難克服','高山上有很多規定要遵守','媽媽每天陪她去爬山','高山上的人都很兇'],h:'爬高山時會遇到哪些困難？例如天氣、空氣、山路……',st:['這句用譬喻，把高山比成母親。','母親「溫柔」＝美麗的雲海；母親「嚴格」＝給她困難的考驗。','高山的考驗就是危險的天氣和地形。'],k:'讀譬喻句時，要想想「比的是哪一個特點」。'},
{f:F.g6,t:'read',lv:2,tag:'課文理解',p:P.jiang,q:'根據這段文字，下列哪一個說法正確？',o:['江秀真是第一位登上世界最高峰的臺灣女性','江秀真從小在海邊長大','江秀真沒有經過訓練就成功登頂','江秀真第一次爬山就登上世界最高峰'],h:'一個一個選項回到文章裡找證據，看看哪一個和文章寫的一樣。',st:['文章說她從小在山邊長大，不是海邊。','她進行了很長時間的訓練，不是沒有訓練。','她高中開始爬山，後來才挑戰世界最高峰；文章最後寫她是第一位登上世界最高峰的臺灣女性。'],k:'閱讀題要「回到文章找證據」，不要只憑印象。'},
{f:F.g1,t:'choice',lv:3,tag:'修辭辨析',q:'下列哪一個句子的修辭，和其他三句「不一樣」？',o:['弟弟的臉紅得像蘋果','小草向我點頭微笑','風輕輕的唱著歌','花兒害羞的低下頭'],h:'先一句一句判斷：哪些句子讓「物」做出人的動作？哪一句是把甲比成乙？',st:['「小草點頭微笑」「風唱歌」「花兒害羞」都是讓物像人一樣，是擬人。','「臉紅得像蘋果」是把臉比成蘋果，用了「像」，是譬喻。','所以和其他三句不一樣的是「弟弟的臉紅得像蘋果」。'],k:'譬喻：把甲比成乙（像、是）；擬人：讓物有人的動作或情感。'},
{f:F.g5,t:'choice',lv:3,tag:'課文比較',q:'〈永遠的馬偕〉、〈假如給我三天光明〉、〈攀登生命的高峰〉這三課，最大的共同點是什麼？',o:['都在介紹值得學習的人物和他們的精神','都是童詩','都在介紹運動的方法','故事都發生在臺灣以外的地方'],h:'想想三課的主角：馬偕、海倫‧凱勒、江秀真。他們身上有什麼值得我們學習的地方？',st:['馬偕：為臺灣奉獻一生；海倫‧凱勒：看不見仍用心感受世界；江秀真：勇敢追夢。','三課都是記敘或散文，不是童詩，也不是在教運動方法。','共同點是：介紹值得學習的人物和他們的精神。'],k:'第4～6課：從人物故事學習奉獻、珍惜與堅持的精神。'},
{f:F.g4,t:'fill',lv:3,tag:'句型：不但……反而……',q:'看到同學跌倒，他不但沒有幫忙，＿＿在旁邊大笑。',o:['反而','而且','所以','因為'],h:'前面說「沒有幫忙」，後面的行為更出乎意料、和應該做的事相反，要用哪個詞？',st:['「不但沒有……反而……」表示結果和應該發生的相反。','應該要幫忙，他卻在旁邊大笑，和應該做的相反。','所以空格填「反而」。'],k:'不但沒有……反而……：結果和預期相反。'},
{f:F.g3,t:'fill',lv:3,tag:'成語運用',q:'要在一天之內爬上這座又高又陡的大山，對初學者來說，簡直是＿＿的夢想。',o:['遙不可及','熟能生巧','依依不捨','一掃而空'],h:'對初學者來說很難、好像怎麼樣都做不到，要選哪個成語？',st:['句子說：又高又陡、初學者、一天之內——非常困難。','形容遠得到不了、很難達成的成語是「遙不可及」。','課文中作者也覺得籃球架像一座遙不可及的高山。'],k:'遙不可及：遠得到達不了，比喻很難達成。'}
];

const QS=[
{f:F.s1,t:'choice',lv:1,tag:'地圖四要素',q:'一張完整的地圖，通常要有哪四個要素？',o:['圖名、方向標、比例尺、圖例','圖名、顏色、照片、文字','方向標、地址、電話、比例尺','圖例、天氣、時間、圖名'],h:'想想看：地圖叫什麼名字？哪邊是北？實際多遠？符號代表什麼？',st:['地圖叫什麼名字 → 圖名。','哪邊是北方 → 方向標；實際距離縮小多少 → 比例尺。','符號代表什麼 → 圖例。四個合起來就是地圖四要素。'],k:'地圖四要素：圖名、方向標、比例尺、圖例。'},
{f:F.s1,t:'fill',lv:1,tag:'地圖四要素',q:'地圖上用簡單的符號代表實際的景物，並在旁邊加以說明，這個要素叫做＿＿。',o:['圖例','圖名','比例尺','方向標'],h:'看到地圖上的「卍」或「●」，要看哪裡才知道它代表什麼？',st:['地圖上會用符號代表學校、車站等景物。','說明「每個符號代表什麼」的地方叫圖例。','圖名是名稱、比例尺是距離、方向標是方位。'],k:'圖例：說明地圖上各種符號代表的意思。'},
{f:F.s1,t:'read',lv:1,fig:'map',tag:'方位判讀',q:'請看「快樂鎮地圖」，學校在車站的哪一個方向？',o:['東方','西方','南方','北方'],ns:1,h:'先看方向標：箭頭朝上是北。那麼地圖的「右邊」是什麼方向？',st:['方向標箭頭朝上，表示上方是北。','上北、下南、左西、右東。','學校在車站的右邊，所以學校在車站的東方。'],k:'方向標朝上時：上北、下南、左西、右東。'},
{f:F.s1,t:'fill',lv:2,fig:'map',tag:'比例尺',q:'請看「快樂鎮地圖」的比例尺。沿著道路從車站走到學校，大約是＿＿。',o:['1公里','2公里','3公里','6公里'],a:2,ns:1,h:'比例尺上一小段代表 1 公里。數數看：道路上的刻度把車站到學校分成幾段一樣長的距離？',st:['比例尺：一小段（0到1）＝實際 1 公里。','道路上的刻度把車站到學校分成 3 段，每段都和比例尺一樣長。','3 段 × 1 公里 ＝ 3 公里。'],k:'比例尺：把地圖上的長度換算成實際距離。'},
{f:F.s1,t:'read',lv:1,fig:'map',tag:'圖例判讀',q:'「快樂鎮地圖」上的「卍」符號代表什麼？要看哪一個要素才知道？',o:['廟宇，看圖例','學校，看圖名','廟宇，看比例尺','公園，看方向標'],h:'符號的意思，要對照哪一個框框裡的說明？',st:['地圖上的符號，要看「圖例」才知道意思。','圖例中「卍」旁邊寫著「廟宇」。','所以答案是：廟宇，看圖例。'],k:'看不懂符號 → 找圖例。'},
{f:F.s1,t:'read',lv:2,fig:'map',tag:'方位判讀',q:'看「快樂鎮地圖」，從廟宇出發一直往東走，過了河以後，會先遇到哪一個地點？',o:['公園','車站','學校','廟宇'],h:'往東走就是往地圖的右邊走。從廟宇往右邊看，過河後是什麼？',st:['方向標朝上，所以「東」在地圖右邊。','從廟宇往右（東）走，會先經過河流。','過了河，最先遇到的是公園。'],k:'判斷方位：先看方向標，再找起點，往指定方向找。'},
{f:F.s1,t:'situ',lv:2,fig:'map_noscale',tag:'地圖四要素',q:'小美畫了一張「我家附近地圖」（如圖）。老師說少了一個要素，所以看不出實際距離有多遠。少了哪一個要素？',o:['比例尺','圖名','圖例','方向標'],h:'哪一個要素是用來換算「實際距離」的？',st:['圖上有圖名「我家附近地圖」、有方向標，也有圖例。','能告訴我們「實際距離」的要素是比例尺。','這張地圖沒有比例尺，所以算不出實際有多遠。'],k:'比例尺：表示實際距離縮小的程度。'},
{f:F.s1,t:'choice',lv:3,fig:'map_rot',tag:'方向標判讀',q:'這張地圖的方向標箭頭指向「右邊」。那麼地圖的「上方」是什麼方位？',o:['北','東','南','西'],a:3,ns:1,h:'箭頭指的永遠是「北」。想像你面向北方（右邊）站著，你的左手邊（也就是地圖上方）是什麼方向？',st:['方向標箭頭指右 → 地圖的右邊是北方。','面向北方時：左手是西、右手是東、背後是南。','面向地圖右邊時，左手邊剛好是地圖上方，所以上方是西。'],k:'一定要先看方向標！不是每張地圖都「上北下南」。'},
{f:F.s1,t:'situ',lv:2,tag:'地圖種類',q:'全家假日想去宜蘭玩，想知道哪裡有好玩的景點和好吃的美食。最適合看哪一種地圖？',o:['觀光導覽圖','行政區圖','地形圖','交通路線圖'],h:'想找「好玩、好吃的地方」，哪種地圖專門介紹景點？',st:['行政區圖：看縣市鄉鎮的劃分。','地形圖：看山地、平原；交通路線圖：看道路和路線。','觀光導覽圖：介紹景點和美食，最適合出遊。'],k:'依照目的選地圖：出去玩→觀光導覽圖、查路線→交通路線圖。'},
{f:F.s1,t:'situ',lv:3,tag:'地圖種類',q:'小安想知道從家裡搭捷運去動物園，要在哪一站轉車。他應該看哪一種地圖？',o:['交通路線圖','觀光導覽圖','地形圖','行政區圖'],h:'要找「搭車路線」和「轉車站」，哪一種地圖畫的是路線？',st:['問題的重點是「搭捷運、轉車」。','交通路線圖會畫出道路、捷運路線和車站。','所以要看交通路線圖。'],k:'交通路線圖：查道路、路線與車站。'},
{f:F.s1,t:'choice',lv:2,tag:'衛星影像',q:'在衛星影像中，一大片「灰白色」的區域，通常代表什麼？',o:['街道和房屋密集、人口多的地方','森林和山地','湖泊和河流','一大片農田'],h:'城市裡的馬路和房子，從天空往下看是什麼顏色？',st:['衛星影像是從太空往下拍的照片。','馬路和房屋從上面看是灰白色，表示人口多。','深綠色才是山地和樹林，人口少。'],k:'衛星影像：灰白色＝房屋街道多；深綠色＝山地樹林。'},
{f:F.s1,t:'situ',lv:1,tag:'描述位置',q:'小宇住在臺南市，他向外國朋友介紹家鄉的位置。哪一句說得最正確？',o:['臺南市在臺灣的南部','臺南市在臺灣的東部','臺南市在臺灣的北部','臺南市在中央山脈的山頂上'],h:'想想看臺南在臺灣地圖上是靠上面、下面，還是右邊？',st:['臺灣地圖上，北部在上面、南部在下面。','臺南市位在臺灣的西南邊，屬於南部。','東部是花蓮、臺東；北部是臺北、新北等。'],k:'描述家鄉位置：先說它在臺灣的哪一部（北、中、南、東）。'},

{f:F.s2,t:'fill',lv:1,tag:'五大地形',q:'四周被山地或丘陵圍繞、中間地勢低平的地形，叫做＿＿。',o:['盆地','平原','臺地','丘陵'],h:'想像一個洗臉「盆」：邊邊高、中間低。',st:['四周高、中間低，形狀像一個盆子。','這種地形就叫盆地。','例如臺北盆地、臺中盆地、埔里盆地。'],k:'盆地：四周高、中間低平。'},
{f:F.s2,t:'choice',lv:1,tag:'五大地形',q:'「地勢低平、多在海邊、面積廣大」的是哪一種地形？',o:['平原','山地','丘陵','盆地'],h:'又低又平、一大片，適合種稻子的地形是什麼？',st:['山地很高、丘陵有起伏，都不平坦。','盆地雖然中間低平，但四周有山圍繞。','又低又平、面積廣大、靠近海的是平原，例如嘉南平原。'],k:'平原：地勢低平、面積廣大。'},
{f:F.s2,t:'choice',lv:2,tag:'五大地形',q:'「比周圍的地方高，但頂部很平坦，像一張大桌子」的是哪一種地形？',o:['臺地','盆地','丘陵','平原'],h:'「臺」就是高起來的平臺，像舞臺一樣。',st:['盆地是中間低，不是高。','丘陵有起伏，頂部不平坦。','比周圍高、上面平平的，就是臺地，例如桃園臺地。'],k:'臺地：比周圍高、頂部平坦。'},
{f:F.s2,t:'read',lv:2,fig:'land',tag:'地形判讀',q:'上圖是地形示意圖，哪一個代號是「丘陵」？',o:['A','B','C','D','E'],a:1,ns:1,h:'丘陵的特徵是「高度比山地低、起伏比較和緩」。找找看哪裡是一個個低矮的小山丘？',st:['A 最高、最陡，是山地。','B 是一個個低矮、起伏和緩的小山丘，是丘陵。','C 頂部平坦是臺地，D 四周高中間低是盆地，E 低平靠海是平原。'],k:'丘陵：高度較低、起伏和緩。'},
{f:F.s2,t:'read',lv:3,fig:'land',tag:'地形判讀',q:'上圖中，哪一個代號是「盆地」？',o:['A','B','C','D','E'],a:3,ns:1,h:'盆地是「四周高、中間低」。找找看哪一個代號的左右兩邊都比較高？',st:['先找地勢低的地方：D 和 E。','E 雖然低平，但旁邊是海，沒有被高地圍住，是平原。','D 的左邊是臺地、右邊是山丘，四周高、中間低，所以是盆地。'],k:'分辨盆地和平原：盆地被高地圍住，平原開闊、常靠海。'},
{f:F.s2,t:'situ',lv:2,tag:'地形與生活',q:'住在山坡地的阿公，最可能利用坡地種植什麼？',o:['茶樹或果樹','一大片稻田','魚塭養殖','蓋大型工廠'],h:'山坡地斜斜的、不平坦，哪一種作物適合種在坡地上？',st:['稻田需要平坦又有水的土地，比較適合平原。','魚塭在海邊，大型工廠需要平坦的大片土地。','丘陵、山地的坡地，居民常開闢茶園、果園。'],k:'丘陵、山地：常開闢茶園、果園。'},
{f:F.s2,t:'situ',lv:3,tag:'地形與生活',q:'小芳的家鄉地勢平坦，而且就在海邊。她在家鄉最可能看到什麼景觀？',o:['魚塭和稻田','一層層的茶園','高山上的積雪','只有森林、沒有房子'],h:'「平坦」適合做什麼？「靠海」又適合做什麼？',st:['地勢平坦 → 適合耕種，可以看到稻田。','靠海 → 適合養殖，可以看到魚塭。','所以最可能看到魚塭和稻田，形成漁村和農村。'],k:'靠海的平原：可能有魚塭，形成漁村。'},
{f:F.s2,t:'situ',lv:3,tag:'人與環境互動',q:'下列哪一個例子，說明「人們的活動也會改變地表的景觀」？',o:['居民把山坡開墾成一層層的梯田','颱風把大樹吹倒','地震造成山崩','河水自己改變流向'],h:'題目問的是「人」做的事。哪一個選項是人做的？',st:['颱風、地震、河水改道都是大自然造成的。','只有「開墾梯田」是人的活動。','人們開墾、蓋房子、修路，都會改變地表的樣子。'],k:'地形影響人的生活；人的活動也會改變地表景觀。'},

{f:F.s3,t:'choice',lv:1,tag:'天氣與氣候',q:'下列哪一句說的是「氣候」，而不是「天氣」？',o:['高雄一年四季的氣溫都很高','今天下午會下雷陣雨','明天早上氣溫攝氏18度','現在外面正吹著大風'],h:'天氣是「短時間」的變化；氣候是「很多年」整理出來的特色。',st:['「今天下午」「明天早上」「現在」都是短時間，說的是天氣。','「一年四季」是長時間的整體特色。','所以「高雄一年四季氣溫都很高」說的是氣候。'],k:'天氣＝短時間的變化；氣候＝長時間的平均特色。'},
{f:F.s3,t:'read',lv:2,fig:'rain',tag:'雨量圖判讀',q:'請看甲、乙兩地的每月雨量圖。哪一地屬於「夏季多雨、冬季少雨」？',o:['甲地','乙地','兩地都是','兩地都不是'],a:1,ns:1,h:'先看冬天（12月、1月、2月）的長條，哪一地的長條特別矮？',st:['甲地：每個月的長條都很高，是四季多雨。','乙地：6～8月（夏天）很高，12～2月（冬天）很矮。','所以乙地是夏季多雨、冬季少雨。'],k:'看雨量圖：比較「夏天」和「冬天」長條的高低。'},
{f:F.s3,t:'read',lv:3,fig:'rain',tag:'雨量圖判讀',q:'根據甲、乙兩地的雨量圖，下列哪一個說法正確？',o:['甲地冬季的雨量比乙地多','乙地每個月都下很多雨','兩地每個月的雨量都一樣','甲地只有夏天才下雨'],h:'把兩張圖的「1月」長條放在一起比比看。',st:['看1月：甲地長條很高，乙地長條很矮 → 甲地冬季雨量比較多。','乙地冬天雨量很少，不是每個月都很多。','甲地每個月都有不少雨，不是只有夏天下雨。'],k:'四季多雨（如基隆）；夏雨冬乾（如高雄）。'},
{f:F.s3,t:'situ',lv:2,tag:'氣候與生活',q:'九份的老房子，屋頂常常鋪上一層黑黑的「油毛氈」，主要是為了什麼？',o:['防雨','讓屋頂變白','裝飾得更漂亮','讓屋子變冷'],h:'九份在北臺灣的山上，那裡的雨量多不多？',st:['九份靠近基隆，一年四季常常下雨。','油毛氈塗有瀝青，可以防水。','居民依照「多雨」的氣候，選擇防雨的建材。'],k:'氣候影響生活：多雨的地方，房屋要能防雨。'},
{f:F.s3,t:'situ',lv:3,tag:'氣候與生活',q:'澎湖七美的雨量很少，居民種花生，不種稻米。最主要的原因是什麼？',o:['花生比較耐旱','稻米不好吃','花生長得比較高','大家比較喜歡吃花生'],h:'種稻子需要很多水。在雨量少的地方，要選什麼樣的作物？',st:['稻米需要大量的水才能生長。','七美雨量少，水不夠種稻。','花生比較耐旱，適合在少雨的地方種植。'],k:'居民會依照氣候選擇作物。'},
{f:F.s3,t:'choice',lv:1,tag:'水資源',q:'下列哪一個「不是」家鄉水資源的來源？',o:['沙漠','河川','地下水','湖泊'],h:'水資源就是「有水」的地方。哪一個地方幾乎沒有水？',st:['河川、湖泊、地下水、海洋都是水資源的來源。','沙漠非常乾燥，幾乎沒有水。','所以「沙漠」不是水資源的來源。'],k:'水資源：河川、湖泊、地下水、海洋。'},
{f:F.s3,t:'fill',lv:2,tag:'河川水量',q:'濁水溪在＿＿雨量多，河水量比較大；冬季雨量少，河床會露出來。',o:['夏季','冬季','每一天','晚上'],h:'句子後半段說「冬季雨量少」，那前半段應該是哪個季節雨量多？',st:['河川的水量會跟著降雨多少改變。','濁水溪在中部，夏天常有颱風、雷雨，雨量多。','所以夏季河水量大，冬季河床裸露。'],k:'河川水量隨季節雨量變化：夏多冬少（如濁水溪）。'},
{f:F.s3,t:'choice',lv:2,tag:'水庫功能',q:'關於水庫的功能，下列哪一項「不正確」？',o:['把河水變成海水','提供民生和工業用水','灌溉農田','水力發電'],h:'水庫是用來「儲存」淡水的。哪一個選項聽起來很奇怪？',st:['水庫可以提供民生和工業用水、灌溉農田、水力發電。','水庫儲存的是淡水，不會變成海水。','所以「把河水變成海水」不正確。'],k:'水庫功能：民生工業用水、灌溉、水力發電。'},
{f:F.s3,t:'situ',lv:1,tag:'愛護水資源',q:'下列哪一個行為，能保護家鄉的水資源？',o:['參加淨灘，不在河邊丟垃圾','在河邊烤肉後把垃圾留下','把用過的炸油倒進水溝','刷牙時讓水龍頭一直開著'],h:'哪一個做法能讓水保持乾淨，或不浪費水？',st:['留下垃圾、倒油進水溝都會汙染水。','刷牙一直開水龍頭會浪費水。','參加淨灘、不亂丟垃圾，才能保護水資源。'],k:'保護水資源是每個人的責任。'},

{f:F.s4,t:'choice',lv:1,tag:'原住民族住屋',q:'排灣族、魯凱族的傳統住屋，主要用什麼建材蓋成？',o:['石板','鋼筋水泥','玻璃','塑膠'],h:'早期的人會「就地取材」，山上最容易找到什麼？',st:['早期沒有工廠製造的建材，大家就地取材。','排灣族、魯凱族住在山區，石板很容易取得。','所以他們蓋石板屋；石板厚實，可以隔熱又保暖。'],k:'石板屋：排灣族、魯凱族；就地取材。'},
{f:F.s4,t:'situ',lv:2,tag:'住屋與環境',q:'蘭嶼的達悟族把住屋蓋成低矮的「半地下式」，最主要是為了什麼？',o:['抵擋強風','方便養魚','讓房子看起來更大','防止小偷'],h:'蘭嶼是一座海島，夏天常有颱風，什麼東西特別強？',st:['蘭嶼四面環海，風很大，又常有颱風。','把房子蓋得低矮、一部分在地下，風就比較吹不到。','這是配合自然環境的住屋設計。'],k:'地下屋：達悟族，低矮可抵擋強風。'},
{f:F.s4,t:'fill',lv:1,tag:'漢人傳統住屋',q:'用竹子當骨架，外面再塗上泥土做成牆壁的房子，叫做＿＿。',o:['竹管仔厝','土埆厝','石板屋','鋼筋大樓'],h:'名字裡就有它的骨架材料喔！',st:['題目說：用「竹子」當骨架。','這種房子叫「竹管仔厝」。','「土埆厝」則是用稻稈、泥土和水做成的土磚蓋的。'],k:'竹管仔厝：竹子骨架＋泥土；土埆厝：土磚。'},
{f:F.s4,t:'read',lv:1,fig:'house',tag:'三合院',q:'請看三合院示意圖。用來晒穀子、讓小朋友遊戲的空地是哪一個代號？',o:['甲','乙','丙','丁'],a:2,ns:1,h:'晒穀子需要一大片空曠、曬得到太陽的地方。',st:['甲是正身，乙是兩側的護龍。','丁是屋後的竹林，可以防風。','丙是房子前面的空地，叫「稻埕」，可以晒穀、遊戲、乘涼。'],k:'稻埕：晒穀、遊戲、乘涼、辦活動。'},
{f:F.s4,t:'read',lv:2,fig:'house',tag:'三合院',q:'三合院中，甲的中間是「正廳」。正廳主要的用途是什麼？',o:['供奉神明和祖先牌位','堆放農具','養雞養鴨','煮飯的廚房'],h:'正廳在整座三合院最中間、最重要的位置。家裡最重要的祭拜活動在哪裡？',st:['正廳在正身的中間，是最重要的位置。','正廳用來供奉神明和祖先牌位。','也會在這裡祭拜和接待客人。'],k:'正廳：供奉神明與祖先、祭拜、待客。'},
{f:F.s4,t:'read',lv:3,fig:'house',tag:'三合院',q:'三合院後方的丁（竹林），對早期的生活有什麼幫助？',o:['防風、防盜，還能提供器物材料','用來晒穀子','供奉祖先','當作孩子的教室'],h:'竹子長得又高又密，種在房子後面可以擋住什麼？竹子還能拿來做什麼？',st:['竹林又高又密，可以擋風、防小偷。','竹子還可以做成竹籃、竹椅等器物，也能當柴火。','晒穀是稻埕的功能，供奉祖先是正廳的功能。'],k:'三合院周圍的竹林、果樹：防風防盜，提供材料和水果。'},
{f:F.s4,t:'choice',lv:3,tag:'住屋擴建',q:'漢人的傳統住屋，常從「一條龍」擴建成「單伸手」，再擴建成「三合院」。主要原因是什麼？',o:['家中人口增加、經濟變好','政府規定一定要改建','颱風把房子吹壞了','想要開咖啡廳'],h:'房子越蓋越大，通常是因為家裡發生了什麼變化？',st:['一條龍只有一排房子。','家裡人變多、錢也比較夠，就加蓋一側（單伸手）。','再加蓋另一側，就變成三合院。'],k:'住屋擴建：依家庭人口與經濟狀況。'},
{f:F.s4,t:'situ',lv:3,tag:'就地取材',q:'早期不論是原住民族或漢人，蓋房子常用石板、竹子、木頭、泥土。共同的原因是什麼？',o:['就地取材，容易取得','這些材料最昂貴','從外國進口最方便','讓房子容易倒塌'],h:'早期交通不方便，也沒有工廠，蓋房子的材料從哪裡來最方便？',st:['早期交通不便，很難從遠方運送材料。','身邊的大自然就有石板、竹子、木頭、泥土。','直接使用附近的材料，就是「就地取材」。'],k:'早期住屋：就地取材，配合自然環境。'},

{f:F.s5,t:'choice',lv:1,tag:'傳統器物',q:'原住民族用竹子或藤，編成漏斗形狀、用來捕魚的器物叫做什麼？',o:['魚筌','木杵','菜櫥','蒸籠'],h:'它的名字裡就有一個「魚」字！',st:['木杵：用來搗製食物。','菜櫥：存放食物；蒸籠：蒸食物。','用竹、藤編成漏斗形狀來捕魚的是魚筌。'],k:'魚筌（ㄑㄩㄢˊ）：竹藤編的捕魚器物。'},
{f:F.s5,t:'situ',lv:3,tag:'永續觀念',q:'魚筌編織時會留一些縫隙，讓小魚可以游出去。這樣做最主要的目的是什麼？',o:['讓小魚長大，魚群可以延續下去','因為編得不夠好','小魚不好吃','讓大魚也可以逃走'],h:'如果連小魚都抓光了，以後還會有魚可以抓嗎？',st:['小魚如果被抓光，就沒有機會長大、生小魚。','留縫隙讓小魚游走，牠們可以繼續長大。','這樣魚群才能延續，這是「永續利用」的智慧。'],k:'魚筌留縫隙：讓魚群延續，展現永續的智慧。'},
{f:F.s5,t:'fill',lv:1,tag:'古今器物',q:'早期用菜櫥來存放食物，現在的家庭大多用＿＿來保存食物。',o:['冰箱','電視','洗衣機','電風扇'],h:'現在家裡的哪一種電器，可以讓食物冷冷的、不容易壞？',st:['菜櫥是用木頭做的櫃子，用來存放飯菜。','現在科技進步，有了可以冷藏、冷凍的電器。','這個電器就是冰箱。'],k:'菜櫥→冰箱；竹蒸籠→電鍋；瓠瓢→塑膠水勺。'},
{f:F.s5,t:'choice',lv:2,tag:'傳統器物',q:'關於「土灶」的說明，下列哪一個正確？',o:['燒木材煮飯，木灰的餘溫可以悶烤地瓜','要插電才能使用','是用塑膠做成的','不能調整火力的大小'],h:'土灶是用泥土做的，早期沒有電，它是靠燒什麼來煮東西？',st:['土灶用泥土做成，燒木材來煮飯、蒸粿。','增加或減少木材，可以控制火力大小。','燒完的木灰還有餘溫，可以悶烤地瓜；冷了還能當肥料。'],k:'土灶：燒木材煮食，木灰可悶地瓜、當肥料。'},
{f:F.s5,t:'read',lv:3,p:P.tools,tag:'器物變遷',q:'從表格中，可以推論出什麼？',o:['器物的材料從取自大自然，變成多用金屬、塑膠','現代人已經不需要煮飯','以前的器物都比現在方便','塑膠器物用完可以很快回歸大自然'],h:'比較表格中「以前的材料」和「現在的材料」，有什麼不同？',st:['以前的材料：竹子、瓠瓜外殼、木頭，都來自大自然。','現在的材料：金屬、塑膠，是人工製造的。','所以器物材料從「取自大自然」變成「多用人工材料」。'],k:'科技進步讓器物更方便，但也要注意塑膠垃圾的問題。'},
{f:F.s5,t:'situ',lv:2,tag:'減塑',q:'媽媽要去市場買菜，哪一個做法最能減少塑膠垃圾？',o:['自備購物袋和保鮮盒','每樣菜都裝一個塑膠袋','多拿幾雙免洗筷備用','用過的塑膠袋直接丟掉'],h:'哪一個做法可以「重複使用」，不用製造新的垃圾？',st:['塑膠不容易分解，丟掉後會變成難處理的垃圾。','自備購物袋、保鮮盒可以重複使用。','所以自備購物袋和保鮮盒最能減塑。'],k:'減塑：自備購物袋、餐具、便當盒。'},

{f:F.n3,t:'choice',lv:2,tag:'月相亮面',q:'「下弦月」是月亮的哪一邊亮？',o:['左半邊','右半邊','上半邊','整個都亮'],h:'上弦月是右邊亮，下弦月剛好相反！',st:['上弦月：右半邊亮。','下弦月：和上弦月相反。','所以下弦月是左半邊亮。'],k:'上弦右亮、下弦左亮。'},
{f:F.n3,t:'situ',lv:2,tag:'節慶與月相',q:'中秋節晚上，全家在院子裡烤肉、賞月。這天的月相最可能是什麼？',o:['滿月','新月','上弦月','眉月'],h:'中秋節是農曆幾月幾日？',st:['中秋節是農曆八月十五。','農曆十五前後是滿月。','所以中秋節賞的是又圓又亮的滿月。'],k:'中秋、端午等節日是依照農曆訂定的。'},
{f:F.n3,t:'situ',lv:3,tag:'月相與農曆',q:'今天是農曆初一，小華晚上想觀察月亮，卻怎麼找都找不到。最可能的原因是什麼？',o:['初一是新月，月亮被照亮的一面幾乎背對地球','月亮那天消失了','一定是被雲擋住了，和日期沒有關係','月亮跑到別的星球去了'],h:'農曆初一的月相叫什麼？那天月亮的亮面朝向哪裡？',st:['農曆初一的月相是新月。','新月時，月亮被太陽照亮的一面幾乎背對地球。','所以我們幾乎看不到月亮，並不是月亮消失了。'],k:'新月（農曆初一）幾乎看不到月亮。'},
{f:F.n3,t:'fill',lv:3,tag:'月相週期',q:'小明在農曆初八看到上弦月。如果他想再看到一次上弦月，大約要再等＿＿天。',o:['29～30','7','15','1'],h:'月相是「一圈一圈」重複的。跑完一整圈要多久？',st:['月相變化有規律，會一圈一圈重複。','跑完一圈（一個週期）約 29～30 天。','所以下一次上弦月，大約在 29～30 天後（下個月的初七、初八）。'],k:'每隔一個週期（約 29～30 天），會再看到相同的月相。'},
{f:F.n3,t:'situ',lv:3,tag:'月相規律',q:'小玉連續幾天在傍晚觀察月亮，發現月亮的亮面一天比一天大。這段時間最可能是農曆的什麼時候？',o:['初一到十五之間','十六到三十之間','只有十五那一天','無法判斷'],h:'亮面一天比一天「大」，代表月亮正在變圓還是變缺？',st:['亮面越來越大，代表月亮越來越圓。','從新月變到滿月，是農曆初一到十五。','所以最可能在農曆初一到十五之間。'],k:'農曆上半月月亮漸漸變圓，下半月漸漸變缺。'},
{f:F.n3,t:'choice',lv:2,tag:'月球表面',q:'伽利略用望遠鏡觀察月球，發現月球表面明暗不同的地方其實是什麼？',o:['不同的地形，像高山、坑洞和低窪地','月亮上的兔子和樹','湖泊和森林','雲朵的影子'],h:'伽利略看到的是「真實的月球表面」，不是傳說故事。',st:['古人看到月亮上的暗影，想像成玉兔搗藥。','伽利略用望遠鏡看，發現那是高山、隕石坑和低窪平坦的地方（叫做「海」）。','月球上沒有水，也沒有森林。'],k:'月球表面有高山、坑洞（環形山）和低窪的「海」。'},

{f:F.n4,t:'choice',lv:1,tag:'水域環境',q:'世界上面積最大、含鹽量比較高的水域是哪一種？',o:['海洋','埤塘','河流','水溝'],h:'哪一種水喝起來鹹鹹的，而且大到看不到邊？',st:['埤塘、河流是淡水，含鹽量低。','海洋的水是鹹的，含鹽量高。','海洋也是世界上面積最大的水域。'],k:'水域分類：淡水（埤塘、河流）、河海口、鹹水（海洋）。'},
{f:F.n4,t:'situ',lv:2,tag:'水域環境',q:'在河流和海洋交界的地方，常可以看到紅樹林、彈塗魚和螃蟹。這種水域叫做什麼？',o:['河海口','埤塘','高山湖泊','游泳池'],h:'題目說是「河流」和「海洋」交界的地方。',st:['河流的淡水和海洋的鹹水在這裡交會。','這裡叫河海口，含鹽量變化大、養分多。','常見紅樹林、彈塗魚、螃蟹和候鳥。'],k:'河海口：含鹽量變化大，有紅樹林、彈塗魚。'},
{f:F.n4,t:'choice',lv:2,tag:'環境與構造',q:'河流的水流得很快。生活在河流中的魚，身體多半是什麼形狀，比較不容易被水沖走？',o:['流線型','正方形','圓球形','又寬又平的方塊'],h:'想想看潛水艇的形狀，前面圓尖、後面細細的，水流過去比較順。',st:['水流很快時，身體受到的阻力越小越好。','流線型身體前尖後細，水流比較容易滑過去。','所以河流中的魚，身體多半是流線型。'],k:'流線型身體：減少水的阻力。'},
{f:F.n4,t:'situ',lv:3,tag:'影響生物的條件',q:'兩個大小相同的池塘：甲池水清澈、陽光充足；乙池水很混濁，又被大樹遮住陽光。哪一個推論最合理？',o:['甲池可能會有比較多種水生植物','兩個池塘的生物一定完全一樣','乙池的水生植物一定比較多','水質和陽光不會影響生物'],h:'植物生長需要什麼？陽光和乾淨的水重不重要？',st:['水生植物需要陽光才能生長。','水質、水流和陽光不同，生物的種類也會不同。','甲池水清又有陽光，比較適合水生植物生長。'],k:'水質、水流、陽光會影響水中生物的種類。'},

{f:F.n5,t:'choice',lv:1,tag:'水生植物分類',q:'根固定在水底的泥土裡，葉子和花「挺出」水面的，是哪一類水生植物？',o:['挺水性植物','浮葉性植物','漂浮性植物','沉水性植物'],h:'題目已經給了提示：葉子和花「挺」出水面！',st:['挺水性：根在泥中，莖葉挺出水面，例如荷花（蓮）。','浮葉性：葉子平貼水面；漂浮性：整株浮在水面。','沉水性：整株都在水面下。'],k:'挺水性植物：荷花（蓮）、茭白筍。'},
{f:F.n5,t:'choice',lv:1,tag:'水生植物分類',q:'布袋蓮屬於哪一類水生植物？',o:['漂浮性','挺水性','浮葉性','沉水性'],h:'布袋蓮的根沒有固定在泥土裡，整株浮在水面上，會隨水漂動。',st:['布袋蓮的根懸在水中，沒有固定在水底。','整株浮在水面，會隨著水流漂動。','這種植物屬於漂浮性植物。'],k:'漂浮性植物：布袋蓮、大萍、浮萍。'},
{f:F.n5,t:'read',lv:2,fig:'pond',tag:'水生植物分類',q:'請看池塘示意圖，哪一株是「浮葉性植物」？',o:['甲','乙','丙','丁'],a:1,ns:1,h:'浮葉性植物的根在泥土裡，葉子「平平的浮在水面上」。',st:['甲：根在泥中、葉子挺出水面 → 挺水性。','乙：根在泥中，長長的葉柄讓葉子平貼水面 → 浮葉性。','丙：整株浮在水面、根沒碰到泥 → 漂浮性；丁：整株在水下 → 沉水性。'],k:'浮葉性植物：睡蓮、臺灣萍蓬草。'},
{f:F.n5,t:'read',lv:1,fig:'pond',tag:'水生植物分類',q:'請看池塘示意圖，哪一株是「沉水性植物」？',o:['甲','乙','丙','丁'],a:3,ns:1,h:'沉水性植物整株都在水面「下面」。',st:['甲、乙的葉子在水面上或貼著水面。','丙浮在水面上。','丁整株都在水面下，是沉水性植物。'],k:'沉水性植物：金魚藻、水蘊草。'},
{f:F.n5,t:'fill',lv:2,tag:'水生植物構造',q:'布袋蓮的葉柄膨大，裡面有很多＿＿，可以幫助它浮在水面上。',o:['空氣','泥沙','種子','小石頭'],h:'游泳圈為什麼能浮在水上？裡面裝了什麼？',st:['布袋蓮的葉柄膨大，像一個小氣球。','裡面有通氣組織，儲存了很多空氣。','就像游泳圈一樣，空氣讓它浮在水面。'],k:'布袋蓮：膨大的葉柄有通氣組織，儲存空氣幫助漂浮。'},
{f:F.n5,t:'situ',lv:3,tag:'水生植物構造',q:'下大雨後池塘的水位升高了，但睡蓮的葉子仍然浮在水面上。最主要的原因是什麼？',o:['睡蓮的葉柄又長又柔軟，可以隨水位伸展','睡蓮會自己游泳','葉子會先沉下去，再長出新葉','根會往上移動'],h:'睡蓮的根在水底泥土裡，連接葉子的是什麼構造？',st:['睡蓮是浮葉性植物，根固定在水底泥中。','它的葉柄又長又柔軟。','水位變高時，葉柄可以伸展，讓葉子一直浮在水面。'],k:'浮葉性植物（睡蓮）：葉柄長而柔軟，隨水位伸展。'},
{f:F.n5,t:'choice',lv:2,tag:'水生植物構造',q:'把蓮藕（荷花的地下莖）切開，會看到很多孔洞。這些孔洞的功用是什麼？',o:['儲存和輸送空氣','讓小蟲住在裡面','儲存泥沙','讓蓮藕變重，沉在泥裡'],h:'荷花的地下莖埋在泥裡，泥巴裡空氣很少，它怎麼得到空氣？',st:['荷花的地下莖（蓮藕）埋在水底泥土中，空氣很少。','蓮藕和葉柄裡有中空的通氣組織。','這些孔洞可以儲存和輸送空氣到泥中的部位。'],k:'荷花：葉柄和地下莖有通氣組織，可以輸送空氣。'},
{f:F.n5,t:'situ',lv:3,tag:'陸生與水生植物',q:'小華把一盆小番茄（陸生植物）整盆泡在水裡好幾天，結果最可能怎樣？',o:['根部缺少空氣而腐爛，植物枯死','長得更快、更高','變成水生植物','開出更多的花'],h:'水生植物有「通氣組織」可以輸送空氣，陸生植物有嗎？',st:['水生植物有通氣組織，能在水中得到空氣。','陸生植物沒有這種構造。','整盆泡水，根部缺少空氣會腐爛，最後枯死。'],k:'陸生植物缺少通氣組織，長期泡水根會爛。'},
{f:F.n5,t:'fill',lv:1,tag:'水生植物分類',q:'金魚藻整株都生活在水面下，屬於＿＿性植物。',o:['沉水','挺水','浮葉','漂浮'],h:'整株都「沉」在水裡！',st:['金魚藻整株都在水面下。','莖和葉細細軟軟的，隨水流擺動也不容易折斷。','它屬於沉水性植物。'],k:'沉水性植物：金魚藻、水蘊草。'},
{f:F.n5,t:'choice',lv:1,tag:'魚的構造',q:'魚在水中是用什麼構造呼吸的？',o:['鰓','肺','鰭','鱗片'],h:'魚頭的兩側有一片可以開開合合的構造。',st:['鰭：幫助游泳、轉彎和平衡。','鱗片：保護身體。','鰓：吸取水中的氧氣，是魚的呼吸器官。'],k:'魚用鰓呼吸，用鰭游泳。'},
{f:F.n5,t:'fill',lv:2,tag:'魚的構造',q:'魚靠著擺動身體和＿＿，在水中前進、轉彎和保持平衡。',o:['鰭','鰓','鱗片','眼睛'],h:'魚身上像小扇子一樣、會擺動的構造是什麼？',st:['魚游泳時會擺動身體和尾巴。','身上的鰭（背鰭、胸鰭、尾鰭等）幫忙前進、轉彎、平衡。','鰓是呼吸用的，鱗片是保護身體的。'],k:'鰭：前進、轉彎、平衡。'},
{f:F.n5,t:'situ',lv:2,tag:'水生動物構造',q:'水黽可以站在水面上滑來滑去，不會沉下去。主要是因為什麼？',o:['腳上有細毛，不容易沾濕','身體非常重','一直拍動翅膀','水黽很會游泳'],h:'仔細看水黽細細長長的腳，上面有什麼特別的構造？',st:['水黽的身體很輕。','腳上有許多細毛，不容易沾到水。','所以能站在水面上滑行。'],k:'水黽：腳上有細毛，能在水面上活動。'},
{f:F.n5,t:'situ',lv:3,tag:'水生動物構造',q:'青蛙和鴨子的腳趾之間都有「蹼」。蹼最主要的功用是什麼？',o:['幫助划水游泳','幫助爬樹','用來呼吸','用來吃東西'],h:'游泳時穿的「蛙鞋」，就是模仿蹼的形狀喔！',st:['蹼是連接腳趾間的薄膜。','划水時，蹼可以推動更多的水。','所以蹼能幫助青蛙、鴨子游得更快。'],k:'蹼：增加划水面積，幫助游泳。'},
{f:F.n5,t:'read',lv:3,p:P.breath,tag:'水生動物呼吸',q:'根據表格資料，下列哪一個推論正確？',o:['不是所有水生動物都用鰓呼吸','所有水生動物都用鰓呼吸','海豚可以一直待在水裡，不用換氣','龍蝨不需要空氣'],h:'比較表格中三種動物「怎麼呼吸」，牠們的方法都一樣嗎？',st:['吳郭魚用鰓呼吸。','海豚用肺呼吸，要浮出水面換氣；龍蝨會把空氣帶到水裡。','所以水生動物的呼吸方式不一定相同，不是都用鰓。'],k:'水生動物的呼吸方式不同：魚用鰓，海豚用肺。'},

{f:F.n6,t:'choice',lv:1,tag:'保護水域',q:'下列哪一個行為，能保護水域環境？',o:['不放生、不棄養動植物','把不想養的魚倒進河裡','在海邊丟垃圾','工廠的廢水直接排進河流'],h:'哪一個做法不會傷害水裡的生物？',st:['棄養的魚可能破壞河裡原本的生態。','垃圾和廢水都會汙染水域，讓生物生病或死亡。','不放生、不棄養，才是保護水域的做法。'],k:'保護水域：不放生棄養、不亂丟垃圾、廢水要先處理。'},
{f:F.n6,t:'situ',lv:2,tag:'塑膠微粒',q:'塑膠垃圾流進海洋後，會碎裂成很小很小的「塑膠微粒」。這最可能造成什麼影響？',o:['被海洋生物吃下肚，最後可能進入人體','讓海水變得更乾淨','變成魚的營養','讓珊瑚長得更快'],h:'小小的塑膠，海裡的小動物會不會誤以為是食物？',st:['塑膠很難分解，只會碎成越來越小的塑膠微粒。','海洋生物（如貝類、魚）可能把它吃下肚。','人吃了這些海鮮，塑膠微粒也可能進入人體。'],k:'減少一次性塑膠，就是保護海洋，也保護自己。'},
{f:F.n6,t:'situ',lv:3,tag:'放生與棄養',q:'小明養的烏龜長太大了，他想把牠放進附近的池塘。你會給他什麼建議？',o:['不要隨意放生，可以找人認養或詢問動物保護單位','放進池塘最自由','放到海裡比較寬廣','放在路邊讓別人撿'],h:'外來的動物放進池塘，會不會和原本的生物搶食物、搶地盤？',st:['隨意放生的動物，可能和原本的生物搶食物、搶空間。','也可能因為環境不適合而死亡。','負責任的做法是找人認養，或詢問動物保護單位。'],k:'不放生、不棄養，是對生命和環境負責。'},
{f:F.n3,t:'choice',lv:3,tag:'月相規律推理',q:'小美說：「今天晚上是滿月，所以下星期的同一天晚上，也一定是滿月。」哪一個說明最正確？',o:['不對，月相約 29～30 天才循環一次，下星期大約是下弦月','對，月相每星期都一樣','不對，下星期一定是新月','不對，下星期月亮會消失不見'],h:'滿月大約是農曆十五。再過 7 天是農曆幾日？那天是什麼月相？',st:['月相約 29～30 天才會循環一次，不是每星期都一樣。','今天滿月（約農曆十五），再過 7 天約是農曆廿二。','農曆廿二、廿三左右是下弦月。'],k:'月相週期約 29～30 天；十五滿月，廿二三下弦月。'},
{f:F.n2,t:'choice',lv:3,tag:'觀測方法',q:'為什麼記錄月亮的位置時，要同時寫下「方位」和「高度角」？',o:['方位說明在哪個方向、高度角說明有多高，合起來才能準確找到月亮','只要記一個就夠了，另一個是多餘的','因為月亮不會移動','因為高度角要用指北針來量'],h:'只知道「在東南方」，你知道要抬頭看多高嗎？只知道「30 度」，你知道要面向哪裡嗎？',st:['方位（用指北針）：告訴我們月亮在哪個方向。','高度角（用拳頭或觀測器）：告訴我們月亮離地平線有多高。','兩個資料合起來，才能準確描述月亮的位置。'],k:'月亮位置＝方位（指北針）＋高度角（拳頭或高度角觀測器）。'},
{f:F.n2,t:'situ',lv:1,tag:'指北針',q:'晚上到操場觀察月亮，老師要大家先找出北方。小明應該帶什麼工具？',o:['指北針','溫度計','放大鏡','尺'],h:'哪一個工具的名字裡，就有「北」這個字？',st:['溫度計量溫度、放大鏡看細小的東西、尺量長度。','要找方位，要用指北針。','指北針的紅色（N）指針會指向北方。'],k:'找方位用指北針；量高度角用拳頭或高度角觀測器。'},

function moon(cx,cy,r,p){
  let s=`<circle cx="${cx}" cy="${cy}" r="${r}" fill="#3a4766" stroke="#6a7898" stroke-width="1.5"/>`;
  const L='#ffe27a';
  if(Math.abs(p-0.5)<1e-6)return s+`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${L}"/>`;
  if(p<0.005||p>0.995)return s;
  const rx=(Math.abs(Math.cos(2*Math.PI*p))*r).toFixed(2),top=`${cx},${cy-r}`,bot=`${cx},${cy+r}`;
  let d;
  if(p<0.5)d=`M${top} A${r},${r} 0 0 1 ${bot} A${rx},${r} 0 0 ${p<0.25?0:1} ${top}Z`;
  else d=`M${top} A${r},${r} 0 0 0 ${bot} A${rx},${r} 0 0 ${p>0.75?1:0} ${top}Z`;
  return s+`<path d="${d}" fill="${L}"/>`;
}

  s+=`<g fill="#f48fb1" stroke="#d81b60" stroke-width="1"><ellipse cx="89" cy="32" rx="5" ry="11" transform="rotate(-25 89 32)"/><ellipse cx="103" cy="32" rx="5" ry="11" transform="rotate(25 103 32)"/><ellipse cx="96" cy="29" rx="6" ry="12"/></g>`;
  s+=`<path d="M70,220 l-9,15 M70,220 l7,17 M80,220 l-5,13 M80,220 l9,11" stroke="#5d4a3a" stroke-width="2"/>`;
  s+=`<path d="M190,220 C176,180 206,130 194,84" stroke="#2e7d32" stroke-width="3" fill="none"/><ellipse cx="194" cy="81" rx="34" ry="6" fill="#3e9d48" stroke="#2e7d32"/><circle cx="216" cy="74" r="7" fill="#fff59d" stroke="#f9a825"/><path d="M190,220 l-8,13 M190,220 l8,14" stroke="#5d4a3a" stroke-width="2"/>`;
  s+=`<path d="M298,88 C296,110 300,125 296,140 M306,88 C308,112 304,128 308,146 M314,88 C316,110 312,124 316,138 M322,88 C320,106 324,120 322,132" stroke="#6d5a4a" stroke-width="1.6" fill="none"/>`;
  s+=`<ellipse cx="310" cy="84" rx="24" ry="5" fill="#558b2f"/><ellipse cx="298" cy="72" rx="9" ry="12" fill="#66bb6a" stroke="#2e7d32"/><ellipse cx="322" cy="72" rx="9" ry="12" fill="#66bb6a" stroke="#2e7d32"/><ellipse cx="310" cy="66" rx="9" ry="13" fill="#66bb6a" stroke="#2e7d32"/><circle cx="296" cy="54" r="9" fill="#43a047"/><circle cx="324" cy="54" r="9" fill="#43a047"/><circle cx="310" cy="46" r="10" fill="#43a047"/>`;
  s+=`<path d="M420,220 C412,190 430,150 420,112" stroke="#1b5e20" stroke-width="3" fill="none"/>`;
  [200,182,164,146,128,114].forEach((y,i)=>{const x=i%2?423:419;s+=`<path d="M${x},${y} l-15,-6 M${x},${y} l15,-6 M${x},${y} l-11,7 M${x},${y} l11,7" stroke="#388e3c" stroke-width="2"/>`;});
  s+=lab(70,252,'甲')+lab(190,252,'乙')+lab(310,252,'丙')+lab(420,252,'丁');

}
const FIG={
  map:()=>mapSVG(),
  map_noscale:()=>mapSVG({noScale:1,title:'我家附近地圖'}),
  map_rot:()=>mapSVG({rot:1,title:'公園附近地圖'}),
  land:landSVG,rain:rainSVG,house:houseSVG,fist:fistSVG,compass:compassSVG,pond:pondSVG,
  moon_q:()=>moonPanel([[0.25,'']]),
  moon_seq:()=>moonPanel([[0.5,'甲'],[0.25,'乙'],[0.1,'丙'],[0.75,'丁']])
};

/* ============ 程式設定 ============ */
const ROUND=10;
const TYPES=['choice','fill','situ','read'];
const TN={choice:'選擇題',fill:'填空題',situ:'生活情境應用題',read:'閱讀判讀題'};
const LV=['','基礎','進階','素養挑戰'];
const SJ={
  '國語':{c:'#e0574a',c2:'#fdeae7',ic:'📖',r:'康軒版｜第 1～6 課',d:'生字注音、部首、形近字、成語、修辭句型、閱讀理解'},
  '社會':{c:'#d4861a',c2:'#fdf0dc',ic:'🗺️',r:'康軒版｜第 1～2 單元',d:'地圖四要素、五大地形、氣候與水資源、傳統住屋與器物'},
  '自然':{c:'#2f9a62',c2:'#e3f4ea',ic:'🌙',r:'南一版｜第 1～2 單元',d:'太陽與影子、月亮觀測、月相、水生動植物'},
  'mix':{c:'#5873d6',c2:'#e8edfb'}
};
const PRAISE=['太棒了！一次就答對！🎉','好厲害！觀念超清楚！👏','完全正確！你真的有認真複習喔！🌟','答對了！給你一個大大的讚！👍','漂亮！這題難不倒你！✨'];
const PRAISE2=['答對了！看了提示就想通，這就是進步！💪','很好！會修正就是最棒的學習！😊','對了！你把提示用得很好喔！👍'];
const CHEER=['再想一次，你一定可以的！','慢慢來，再讀一次題目看看！','相信自己，再試一次！'];
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const app=document.getElementById('app');
let S=null;
let SEEN=new Set();
try{SEEN=new Set(JSON.parse(localStorage.getItem('g4mid_seen')||'[]'));}catch(e){}
function saveSeen(){try{localStorage.setItem('g4mid_seen',JSON.stringify([...SEEN]));}catch(e){}}

/* ============ 出題邏輯 ============ */
function pick(){
  const type=TYPES[S.n%TYPES.length];
  const pool=Q.filter(q=>!S.used.has(q.id)&&(S.mode==='mix'||q.s===S.mode));
  const cnt={'國語':0,'社會':0,'自然':0};
  S.hist.forEach(h=>{cnt[h.q.s]++;});
  const mx=Math.max(...Object.values(cnt));
  let best=null,bs=-1;
  pool.forEach(q=>{
    let sc=Math.random()*15;
    if(q.t===type)sc+=100;                       // 題型依序輪替
    const d=Math.abs(q.lv-S.level);
    sc+=d===0?60:d===1?25:0;                     // 即時難度
    if(S.reinforce&&q.f===S.reinforce&&q.lv===1)sc+=40; // 答錯後回到同單元基礎題
    if(!SEEN.has(q.id))sc+=30;                   // 優先出沒做過的題目
    if(S.mode==='mix')sc+=(mx-cnt[q.s])*25;      // 混合模式三科平均
    if(sc>bs){bs=sc;best=q;}
  });
  return best;
}

/* ============ 畫面 ============ */
function renderHome(){
  S=null;
  app.innerHTML=`
  <div class="hero"><span class="badge">四年級上學期・第一次定期評量</span><h1>期中考複習小教室</h1><p class="sub">國語・社會・自然　互動練習</p></div>
  <div class="teacher"><div class="av" aria-hidden="true">🧑‍🏫</div><div class="bubble">嗨～歡迎來到期中考複習小教室！我是今天陪你複習的老師 😊<br>今天共有 <b>國語、社會、自然</b> 3 個科目可以練習，每回合 ${ROUND} 題。<br>你想先從<b>哪一個科目</b>開始測驗？還是要由老師進行<b>三科隨機混合挑戰</b>？</div></div>
  <div class="subjects">${['國語','社會','自然'].map(s=>`<button class="subj" style="--sc:${SJ[s].c};--sc2:${SJ[s].c2}" data-act="start" data-v="${s}"><span class="ic" aria-hidden="true">${SJ[s].ic}</span><b>${s}</b><small class="r">${SJ[s].r}</small><small>${SJ[s].d}</small></button>`).join('')}</div>
  <button class="mixbtn" data-act="start" data-v="mix">🎲 由老師出題：三科隨機混合挑戰</button>
  <div class="rules"><b>挑戰規則</b><ul>
    <li>一次只出 1 題，題型會在「選擇、填空、生活情境、閱讀判讀」之間輪流。</li>
    <li>答錯了別擔心：第一次老師會給你<b>提示</b>，可以再想一次；第二次老師會<b>一步一步講解</b>。</li>
    <li>連續答對 2 題會<b>升級挑戰</b>；答錯了就先回到基礎題，把觀念打穩。</li>
    <li>10 題做完會有成績單：答對率、精熟知識點、需加強清單和考前衝刺建議。</li>
  </ul></div>
  <p class="foot">題目依 115 學年度康軒版國語、社會與南一版自然四上課程目錄整理，皆為原創練習題（非課本原文），僅供複習使用。</p>`;
  window.scrollTo(0,0);
}

function startRound(mode){
  S={mode,n:0,level:1,streak:0,combo:0,used:new Set(),hist:[],reinforce:null,pending:'',
     notice:`好～${mode==='mix'?'三科隨機混合挑戰':mode+'測驗'}開始囉！一共 ${ROUND} 題，每題讀清楚、想好了再按「確定答案」。第 1 題來囉！`};
  loadQ();
}
function loadQ(){
  const q=pick();
  S.cur=q;S.used.add(q.id);S.sel=null;S.att=0;S.dis=new Set();S.done=false;S.fb='';
  const idx=q.o.map((_,i)=>i);S.order=q.ns?idx:shuffle(idx);
  renderQuiz();window.scrollTo(0,0);
}
function next(){
  S.n++;
  if(S.n>=ROUND){renderSummary();return;}
  S.notice=S.pending;S.pending='';
  loadQ();
}
const isCompact=q=>q.t!=='fill'&&q.o.every(o=>o.length<=1);
function ansText(q){
  if(q.t==='fill'||isCompact(q))return q.o[q.a];
  return 'ABCDE'[S.order.indexOf(q.a)]+'. '+q.o[q.a];
}
function optState(i){
  const q=S.cur;
  if(S.done){if(i===q.a)return['ok',1];if(i===S.sel)return['no',1];if(S.dis.has(i))return['no x',1];return['dim',1];}
  if(S.dis.has(i))return['no x',1];
  if(S.sel===i)return['sel',0];
  return['',0];
}
function renderQuiz(scrollFb){
  const q=S.cur,sj=SJ[q.s];
  let body='';
  if(q.p)body+=`<div class="passage">${q.p}</div>`;
  if(q.fig)body+=`<div class="fig">${FIG[q.fig]()}</div>`;
  if(q.t==='fill'){
    let bt='　　　',bc='';
    if(S.done){bt=q.o[q.a];bc='ok';}else if(S.sel!=null){bt=q.o[S.sel];}
    body+=`<div class="qt">${esc(q.q).replace('＿＿',`<span class="blank ${bc}">${esc(bt)}</span>`)}</div>`;
    body+=`<div class="chips" role="group" aria-label="字卡">`+S.order.map(i=>{const[c,d]=optState(i);return `<button class="chip ${c}" data-act="opt" data-v="${i}" aria-pressed="${S.sel===i}" ${d?'disabled':''}>${esc(q.o[i])}</button>`;}).join('')+`</div>`;
  }else{
    const cp=isCompact(q);
    body+=`<div class="qt">${esc(q.q)}</div><div class="opts ${cp?'compact':''}" role="group" aria-label="選項">`+S.order.map((i,pos)=>{const[c,d]=optState(i);return `<button class="opt ${c}" data-act="opt" data-v="${i}" aria-pressed="${S.sel===i}" ${d?'disabled':''}>${cp?'':`<span class="lt">${'ABCDE'[pos]}</span>`}<span class="ot">${esc(q.o[i])}</span></button>`;}).join('')+`</div>`;
  }
  const btn=S.done
    ?`<button class="btn" data-act="next">${S.n+1>=ROUND?'看成績單 🏁':'下一題 ➜'}</button>`
    :`<button class="btn" data-act="submit" ${S.sel==null?'disabled':''}>${S.att?'再試一次，確定！':'確定答案'}</button>`;
  const pct=(S.n+(S.done?1:0))/ROUND*100;
  app.innerHTML=`<div style="--sc:${sj.c};--sc2:${sj.c2}">
    <div class="top">
      <button class="ghost" data-act="home">← 回首頁</button>
      <div class="prog"><div class="pt">第 ${S.n+1} / ${ROUND} 題 ${S.mode==='mix'?'<small>（三科混合）</small>':''}</div><div class="bar"><i style="width:${pct}%"></i></div></div>
      <div class="meta">難度 <span class="stars" aria-label="${LV[q.lv]}">${'★'.repeat(q.lv)}${'☆'.repeat(3-q.lv)}</span><br>連對 🔥 ${S.combo}</div>
    </div>
    ${S.notice?`<div class="teacher mini"><div class="av" aria-hidden="true">🧑‍🏫</div><div class="bubble">${S.notice}</div></div>`:''}
    <div class="card">
      <div class="tags"><span class="pill s">【${q.s}】</span><span class="pill">${TN[q.t]}</span><span class="pill">${LV[q.lv]}</span></div>
      <div class="focus">【單元焦點】${q.f}｜${q.tag}</div>
      ${body}
      <div aria-live="polite">${S.fb}</div>
      <div class="actions">${btn}</div>
    </div></div>`;
  if(scrollFb){const f=app.querySelector('.fb');if(f)f.scrollIntoView({behavior:'smooth',block:'nearest'});}
}
function selectOpt(i){
  if(!S||S.done||S.dis.has(i))return;
  S.sel=i;renderQuiz();
  const b=app.querySelector(`[data-act="opt"][data-v="${i}"]`);if(b)b.focus({preventScroll:true});
}
function submit(){
  const q=S.cur;if(S.sel==null||S.done)return;
  if(S.sel===q.a){finish(S.att===0?'first':'hint');return;}
  if(S.att===0){
    S.att=1;S.dis.add(S.sel);S.sel=null;S.streak=0;S.combo=0;S.reinforce=q.f;
    let extra='';
    if(S.level>1){
      S.level=1;
      extra='<div class="sm">📉 下一題會先回到「基礎題」，幫你把觀念打穩。</div>';
      S.pending='我們先用基礎題，把觀念練得穩穩的，再慢慢往上挑戰！';
    }
    S.fb=`<div class="fb hint"><div class="t">🤔 差一點點喔！先別急，老師給你一個提示：</div><div class="h">💡 ${q.h}</div><div class="sm">${rnd(CHEER)}（剛剛選的答案已經幫你劃掉了）</div>${extra}</div>`;
    renderQuiz(true);
    return;
  }
  finish('wrong');
}
function finish(res){
  const q=S.cur;S.done=true;
  S.hist.push({q,res});
  SEEN.add(q.id);saveSeen();
  let lv='';
  if(res==='first'){
    S.streak++;S.combo++;S.reinforce=null;
    if(S.streak>=2&&S.level<3){
      S.level++;S.streak=0;
      lv=`<div class="sm">🚀 連續答對 2 題！下一題升級為「${LV[S.level]}」難度！</div>`;
      S.pending=`🚀 你連續答對了！接下來挑戰「${LV[S.level]}」題，要更仔細讀題喔！`;
    }
  }else{S.streak=0;S.combo=0;}
  const key=`<div class="k">📌 <b>觀念鞏固：</b>${q.k}</div>`;
  if(res==='first')S.fb=`<div class="fb ok"><div class="t">${rnd(PRAISE)}</div>${key}${lv}</div>`;
  else if(res==='hint')S.fb=`<div class="fb ok"><div class="t">${rnd(PRAISE2)}</div>${key}</div>`;
  else S.fb=`<div class="fb no"><div class="t">沒關係！我們一起一步一步把它弄懂 🙂</div><div class="ans">✅ 正確答案：<b>${esc(ansText(q))}</b></div><div class="sm"><b>🪜 步驟拆解：</b></div><ol>${q.st.map(x=>`<li>${x}</li>`).join('')}</ol>${key}</div>`;
  renderQuiz(true);
}

function renderSummary(){
  const H=S.hist,n=H.length;
  const first=H.filter(h=>h.res==='first').length,hint=H.filter(h=>h.res==='hint').length,wrong=n-first-hint;
  const rate=Math.round(first/n*100),rate2=Math.round((first+hint)/n*100);
  const weakH=H.filter(h=>h.res!=='first');
  const weakKey=new Set(weakH.map(h=>h.q.s+'｜'+h.q.tag));
  const mastered=[...new Set(H.filter(h=>h.res==='first').map(h=>h.q.s+'｜'+h.q.tag))].filter(k=>!weakKey.has(k));
  const weakMap=new Map();
  weakH.forEach(h=>{const k=h.q.s+'｜'+h.q.tag;const o=weakMap.get(k);if(!o||h.res==='wrong')weakMap.set(k,h);});
  const fc={};weakH.forEach(h=>{fc[h.q.f]=(fc[h.q.f]||0)+(h.res==='wrong'?2:1);});
  const tips=Object.keys(fc).sort((a,b)=>fc[b]-fc[a]).map(f=>TIPS[f]).filter(Boolean).slice(0,3);
  GEN.forEach(t=>{if(tips.length<3)tips.push(t);});
  const medal=rate>=90?'🏆':rate>=70?'🥇':rate>=50?'🌟':'💪';
  const msg=rate>=90?'太厲害了！觀念非常扎實，你已經準備好上考場了！'
    :rate>=70?'很棒喔！大部分的觀念都懂了，把下面的弱點補強就更完美！'
    :rate>=50?'不錯喔！把「需加強」的地方再複習一次，你會進步更多！'
    :'沒關係，複習就是為了找出還不熟的地方。照著下面的建議再練一次，一定會進步！';
  const sj=SJ[S.mode];
  const icon={first:'✅',hint:'💡',wrong:'❌'};
  app.innerHTML=`<div style="--sc:${sj.c};--sc2:${sj.c2}">
    <div class="card sum">
      <div class="medal" aria-hidden="true">${medal}</div>
      <h2>${S.mode==='mix'?'三科混合挑戰':S.mode+'測驗'}・成績單</h2>
      <div class="big">${rate}<small>%</small></div>
      <div class="sm">答對率（一次就答對）　｜　含提示後答對：${rate2}%</div>
      <div class="stats"><div><b>${first}</b><span>一次答對</span></div><div><b>${hint}</b><span>看提示後答對</span></div><div><b>${wrong}</b><span>需要講解</span></div></div>
      <div class="teacher"><div class="av" aria-hidden="true">🧑‍🏫</div><div class="bubble">${msg}</div></div>
    </div>
    <div class="card"><h3>✅ 精熟知識點</h3>${mastered.length?`<div class="chiplist">${mastered.map(k=>`<span class="mtag">${k}</span>`).join('')}</div>`:'<p class="empty">這回合還沒有「一次就答對」的知識點，沒關係，我們再練一次！</p>'}</div>
    <div class="card"><h3>📝 需加強弱點清單</h3>${weakMap.size?`<ul class="weak">${[...weakMap.values()].map(h=>`<li><span class="mini-pill" style="background:${SJ[h.q.s].c}">${h.q.s}</span><b>${h.q.tag}</b><div class="sm" style="color:var(--muted)">${h.q.f}｜${h.res==='wrong'?'❌ 需要老師講解':'💡 看提示後答對'}</div><div class="kk">📌 ${h.q.k}</div></li>`).join('')}</ul>`:'<p class="empty">太厲害了！這回合沒有需要加強的地方 🎉</p>'}</div>
    <div class="card"><h3>🏃 考前衝刺建議</h3><ol class="tips">${tips.map(t=>`<li>${t}</li>`).join('')}</ol></div>
    <details class="card"><summary>🔍 題目回顧（${n} 題）</summary><ol class="rev">${H.map(h=>`<li><span aria-label="${h.res}">${icon[h.res]}</span>【${h.q.s}】${esc(h.q.q.replace('＿＿','（　）'))}<div class="ra">正確答案：${esc(h.q.o[h.q.a])}</div></li>`).join('')}</ol></details>
    <div class="actions"><button class="btn alt" data-act="menu">🏠 換一個科目</button><button class="btn" data-act="again">🔁 再挑戰一回合</button></div>
  </div>`;
  window.scrollTo(0,0);
}

/* ============ 事件 ============ */
app.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,v=b.dataset.v;
  if(a==='start')startRound(v);
  else if(a==='opt')selectOpt(+v);
  else if(a==='submit')submit();
  else if(a==='next')next();
  else if(a==='again')startRound(S.mode);
  else if(a==='menu')renderHome();
  else if(a==='home'){if(confirm('確定要回首頁嗎？這一回合的進度不會保留喔。'))renderHome();}
});
renderHome();
</script>
